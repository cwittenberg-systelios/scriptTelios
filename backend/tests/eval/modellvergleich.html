rsuche ohne ausreichende Stabilisierung erscheint ein stationärer Aufenthalt zur intensiven Behandlung und Krisenintervention dringend indiziert. Mithilfe unseres tiefenpsychologisch fundierten, verhaltenstherapeutisch ergänzten und hypnosystemisch optimierten Therapiekonzepts streben wir an, die intrapsychischen Erlebensmuster und deren Einfluss auf die Symptome zu verstehen und schrittweise zu beeinflussen. Eine grundlegende Modifikation vorbestehender Schutzmuster und der Aufbau fundamentaler Selbstfürsorgeroutinen sind unabdingbar, bevor eine nachhaltige Verbesserung im ambulanten Kontext erreicht werden kann."}, "mistral-small": {"pass": true, "words": 247, "score": 1.0, "issues": [], "style": {"satz": 16.5, "fachb": 0.81, "wir": 0.07}, "text": "Folgende Krankheitssymptomatik macht in der Art und Schwere sowie unter Berücksichtigung der Beurteilung des Einweisers und unseres ersten klinischen Eindruckes ein stationäres Krankenhaussetting akut notwendig:\nWir nehmen Frau M. schwer belastet auf. Sie zeigt sich stark erschöpft und in ihrem Selbstwert erheblich verunsichert. Die Patientin leidet unter einer rezidivierenden depressiven Störung mit gegenwärtig schwerer Episode ohne psychotische Symptome sowie einer generalisierten Angststörung. Diese Symptome haben sich in den letzten Wochen deutlich verstärkt und führen zu erheblichen Einschränkungen im Alltag. Frau M. berichtet von anhaltender depressiver Stimmung, starkem Erschöpfungsempfinden und andauernder Traurigkeit. Sie fühlt sich überfordert und kann sich kaum noch konzentrieren. Ihre Antriebslosigkeit ist so ausgeprägt, dass sie selbst einfache alltägliche Aufgaben wie Duschen oder Zähneputzen nicht mehr bewältigen kann. Zudem plagen sie massive Ängste, insbesondere um die Gesundheit ihres Sohnes, was zu Panikattacken führt. Diese Ängste sind für sie kaum auszuhalten und lösen suizidale Gedanken aus. Die Patientin gibt an, sich im häuslichen Umfeld noch weniger von ihren Ängsten distanzieren zu können. Dies führt dazu, dass sie sich zunehmend ins Alleinsein zurückzieht und sich schuldig und ungenügend fühlt. Trotz ihrer Suizidgedanken konnte Frau M. sich bisher klar davon distanzieren, jedoch bleibt das Risiko bestehen. Somatisch leidet sie unter Schwindel, Herzrasen, Ohrengeräusche, Licht- und Lärmempfindlichkeit sowie Engegefühl in der Brust mit Kurzatmigkeit und Übelkeit. Die Durchschlafstörungen haben sich ebenfalls verschlimmert, was ihre allgemeine Erschöpfung weiter verstärkt. Eine ambulante Behandlung ist aufgrund der Schwere der Symptomatik und des pathogenen Umfelds derzeit nicht ausreichend, um eine Stabilisierung zu erreichen."}, "qwen3_6_27b": {"pass": true, "words": 145, "score": 1.0, "issues": [], "style": {"satz": 24.2, "fachb": 0.0, "wir": 0.17}, "text": "Folgende Krankheitssymptomatik macht in der Art und Schwere sowie unter Berücksichtigung der Beurteilung des Einweisers und unseres ersten klinischen Eindruckes ein stationäre s Krankenhaussetting akut notwendig:\n\nWir nehmen Frau M. schwer belastet auf. Die gezeigte Symptomatik hat sich im Kontext ihrer rezidivierend depressiven Störung stark aggraviert und stellt eine wesentliche Beeinträchtigung sozialer wie auch alltäglicher Funktionen dar. Aktuell ist eine ambulante Behandlung aufgrund der Schwere der Symptomatik und dem pathogenen Umfeld durch massive Zukunftsängste vor ihrem Sohn zum Erreichen ausreichender Besserung nicht darstellbar. Eine grundlegende Modifikation vorbestehender Selbstabwertungsmuster und damit assoziierter Grübelneigungen, sowie der Aufbau fundamentaler Regulationsstrategien bei Panikattacken sind unabdingbar, bevor ein ambulanter Behandlungsansatz Aussicht auf Erfolg haben kann. Zudem bedarf die Patientin 24/7 Verfügbarkeit therapeutischer Unterstützung zur Distanzierung von suizidalen Gedanken, welche durch ihre biographische Familiengeschichte besonders relevant erscheinen. Der multimodale Ansatz unserer Klinik ist gut geeignet, um die nötigen stabilisierenden Schritte einzuleiten."}, "qwen3_30b-a3b": {"pass": true, "words": 233, "score": 1.0, "issues": [], "style": {"satz": 19.4, "fachb": 0.0, "wir": 0.25}, "text": "Folgende Krankheitssymptomatik macht in der Art und Schwere sowie unter Berücksichtigung der Beurteilung des Einweisers und unseres ersten klinischen Eindruckes ein stationäres Krankenhaussetting akut notwendig:\nWir nehmen Frau M. schwer belastet auf.\n\nDie gezeigte Symptomatik hat sich innerhalb weniger Wochen deutlich verschlimmert und stellt eine wesentliche Beeinträchtigung aller alltäglichen Funktionen dar. Sie berichtet von andauernder depressiver Stimmung mit starkem Erschöpfungsempfinden, Konzentrationsschwierigkeiten und Verzweiflung bei gleichzeitig ausgeprägter Selbstabwertung. Die Patientin beschreibt ihr Leben als „Treibsand“ und fühlt sich schuldig ungenügend und nicht mehr fähig ihre grundlegenden Bedürfnisse zu erfüllen wie Duschen oder Zähneputzen. Zudem sind Suizidgedanken im Zusammenhang mit verstärkten Ängsten um ihren Sohn entstanden, die sie selbst als irrational wahrnimmt aber kaum noch kontrollieren kann. Diese Angst vor einem möglichen Unglück ihres Kindes löst wiederum starke Panikattacken mit dem Gefühl „innerlich zu zerbrechen“ aus. Somatische Beschwerden wie Herzrasen Ohrengeräusche Lichtempfindlichkeit und Durchschlafstörnen begleiten diese psychische Belastung intensiv.\nAktuell ist es Frau M. nicht möglich ihrem Alltag nachzukommen schon kleinste Aufgaben erscheinen überfordernd. Eine ambulante Behandlung wäre angesichts dieser Situation nicht ausreichend zur Sicherstellung einer stabilisierenden Therapie. Der häusliche Kontext bietet keine angemessene Entlastung für den aktuellen Zustand. Wir benötigen das strukturierte Umfeld unserer Klinik um Schutzfunktionen systematisch anzugehen und einen Grundstein für neue Bewältigungsstrategien legen zu können. Dabei wird besonders wichtig sein dass wir gemeinsam mit Frau M. die frühere Sinnhaftigkeit ihrer Überlebensstrategien verarbeiten können ohne dabei weitere Anspannung durch äußere Stressoren hinzuzufügen."}, "qwen3_32b": {"pass": true, "words": 210, "score": 1.0, "issues": [], "style": {"satz": 23.3, "fachb": 1.43, "wir": 0.22}, "text": "Folgende Krankheitssymptomatik macht in der Art und Schwere sowie unter Berücksichtung der Beurteilung des Einweisers und unseres ersten klinischen Eindrucks ein stationäres Krankenhaussetting akut notwendig:\n\nWir nehmen Frau M. schwer belastet auf. Sie präsentiert sich in weinerlicher Stimmung mit ausgeprägter Selbstabwertung und einem Gefühl von wiederkehrendem Scheitern trotz langjähriger Behandlungen. Die depressive Episode ist durch anhaltende Traurigkeit, Verzweiflung, Erschöpfung und fehlenden Antrieb gekennzeichnet; sie berichtet, dass selbst grundlegende Tätigkeiten wie Duschen oder Zähneputzen ihr zu einer Überforderung werden. Parallel dazu bestehen generalisierte Angstsymptome mit Panikanfällen, die sich besonders im Kontext ihrer Sorge um ihren Sohn verstärken. Diese Ängste führen nicht nur zu intensiven innerlichen Empfindungen wie Herzrasen, Kurzatmigkeit und Engegefühl, sondern lösen auch lebensüberdrüssige Gedanken aus, wobei sie sich aktuell noch klar von Suizidgedanken distanziert.\nDie psychische Belastung wird begleitet von somatischen Beschwerden wie Schwindel, Ohrgeräusche, Lichtempfindlichkeit und Durchschlafproblemen, was ihre allgemeine Regeneration zusätzlich erschwert. Aufgrund dieser Komplexität und Intensivität der Symptomatik ist eine ambulante Therapie momentan nicht mehr ausreichend zur Sicherstellung einer angemessenen Stabilisierung. Eine stationäre Betreuung bietet hier die Voraussetzung für einen strukturierten therapeutischen Prozess außerhalb ihres häuslichen Umfelds, das als hochbelastend wahrgenommen wird. Dies ermöglicht uns, gezielte Maßnahmen einzuleiten, um sowohl die depressiven als auch angstbedingten Zustände abzubauen und gleichzeitig Ressourcen zur Bewältigung zukünftiger Herausforderungen zu stärken."}}}, {"id": "an-01-depression-lehrerin", "wf": "anamnese", "wfLabel": "Anamnese", "label": "Depression lehrerin", "ref": {"satz": 15.7, "fachb": 0.33, "wir": 0.0}, "outputs": {"gemma3_27b": {"pass": true, "words": 643, "score": 1.0, "issues": [], "style": {"satz": 8.5, "fachb": 0.78, "wir": 0.0}, "text": "Herr T. stellt sich mit dem Hauptanliegen vor, unter seit Monaten zunehmender depressiver Symptomatik zu leiden. Die Beschwerden hätten im Kontext einer belastenden Lebenssituation begonnen und beeinträchtigen aktuell deutlich sein alltägliches Leben. Er berichtet über gedrückte Stimmung, Freud- und Interessenlosigkeit sowie Antriebsminderung. Konkrete erfolgreiche Einflussnahmen auf die Symptomatik seien ihm bisher nicht gelungen, so Herr T.. In der Selbstauskunft wird eine detaillierte Beschreibung der aktuellen Situation und Symptomatik vermisst; diese ist nicht erhoben.\n\nBiographisch betrachtet prägende Lebensereignisse werden in der Selbstauskunft benannt, jedoch ohne konkrete Ausführungen. Auch zur Familienatmosphäre und persönlichen bzw. beruflichen Entwicklung liegen keine näheren Angaben vor. Vorerfahrungen mit psychotherapeutischen oder psychiatrischen Behandlungen sind nicht erwähnt. Eine ausführlichere Anamnese dieser Bereiche erscheint daher notwendig, um ein umfassendes Bild von Herrn T.’s Vorgeschichte zu erhalten.\n\nIm Bereich seiner Ressourcen nennt Herr T. derzeit nichts, was er als wertvoll und hilfreich erlebt. Ebenso fehlen Angaben darüber, was ihm Freude bereitet oder wo seine Kraftquellen liegen. Dies soll im Rahmen des stationären Aufenthalts erkundet werden. Seine Ziele für den Aufenthalt sind ebenfalls noch offen formuliert, ebenso wie mögliche Befürchtungen oder Sorgen. Die verfügbare Zeit für den Aufenthalt wurde nicht angegeben. Mithilfe des Therapiekonzepts soll Herr T. dabei unterstützt werden, seine individuellen Bedürfnisse zu erkennen und hilfreiche Ressourcen zur Entfaltung zu bringen.\n\nKörperlich gibt Herr T. an, dass sich sein Gewicht in jüngster Zeit nicht verändert habe. Aktuelle körperliche Symptome werden teilweise genannt: Schwindel, Herzklopfen/Herzrasen sowie Durchfall werden angekreuzt. Weitere Details hierzu sind der Selbstauskunft zu entnehmen. Akute oder chronische Erkrankungen werden benannt, jedoch ohne Angabe genauer zeitlicher Verläufe. Operationen mit anschließendem Klinikaufenthalt wurden keine angegeben. Regelmäßig eingenommene Medikamente werden aufgelistet, inklusive Dosierungsinformationen; weitere Medikamente werden ebenfalls genannt. Rauchen wird verneint, Alkoholkonsum wird nicht näher spezifiziert. Angaben zum Drogenkonsum erfolgen nicht. Allergien und Lebensmittelunverträglichkeiten bestehen laut Auskunft nicht. Früherkennungsuntersuchungen werden durchgeführt, das Datum der letzten Untersuchung ist dokumentiert. Gynäkologische Vorgeschichte liegt nicht vor (männlicher Patient). Der Impfstatus gegen COVID-19 ist vollständig, der allgemeine Impfstatus aktuell. Familienanamnestisch sind Erkrankungen bekannt, die im Formular detailliert erfasst wurden. Lebensüberdrüssige Gedanken oder Suizidpläne bzw. -versuche werden verneint.\n\nHerr T. gibt an, derzeit nicht aktiv körperlich tätig zu sein, habe aber früher regelmäßig Sport betrieben. Die Erfahrungen bei seiner früheren körperlichen Aktivität beschreibt er als positiv. Bezüglich An- und Abreise benötigt Herr T. Unterstützung und wird von einer Begleitperson begleitet. Das Wunschzeitfenster für ein telefonisches Vorgespräch wurde angegeben.\n\n###BEFUND###\n\nIm Gespräch offen, wach, bewusstseinsklar, zu allen Qualitäten orientiert. Konzentration subjektiv nicht erhoben. Auffassung, Merkfähigkeit und Gedächtnis intakt. Formalgedanklich nicht erhoben, keine Denkverlangsamung, kein Fokus auf bestimmte Themen erkennbar. Phobien/Angst nicht erhoben. Keine Zwänge. Vermeidungsmuster nicht erhoben. Kein Anhalt für Wahn oder Sinnestäuschungen, keine Ich-Störungen (z.B. Depersonalisation, Derealisation, Dissoziation). Stimmungslage gedrückt, affektive Schwingungsfähigkeit eingeschränkt bei insgesamt depressivem Affektlage. Freud und Interessen sind deutlich reduziert. Erschöpfung ist vorhanden. Antrieb ist gemindert. Hoffnungslosigkeit/Insuffizienz nicht erhoben. Schuldgefühle nicht erhoben. Selbstwertgefühl ist nicht erhoben. Gefühlsregulation ist nicht erhoben. Impulskontrolle ist nicht erhoben. Ambivalenz nicht erhoben. Innere Unruhe nicht erhoben. Zirkadianer Rhythmus nicht erhoben. Schlafverhalten durch Durchschlafstörungen beeinträchtigt. Appetenz nicht erhoben. Aggressives Verhalten oder selbstverletzendes Verhalten werden verneint. Sozialer Rückzug nicht erhoben. Essverhalten nicht erhoben. Suchtverhalten nicht erhoben. Somatisierung liegt in Form von Schwindel, Herzklopfen/Herzrasen sowie Durchfall vor. Suizidalität in der Vergangenheit wurde verneint. Aktuelle Verneinung von lebensüberdrüssigen und suizidalen Gedanken, keine suizidale Handlungsplanung oder Handlungsvorbereitung. Zum Zeitpunkt der Aufnahme von akuter Suizidalität klar distanziert.\n\nKörperliche Vorgeschichte zeigt eine stabile Gewichtsverhältnisse. Akute körperliche Symptome umfassen Schwindel, Herzklopfen/Herzrasen und Durchfall. Es bestehen chronische Erkrankungen (Details unklar). Operationen sind bisher nicht erfolgt. Regelmäßig eingenommene Medikamente werden benannt (genaue Angaben liegen vor). Rauchen wird verneint, Alkoholkonsum ist nicht näher spezifiziert, Drogenkonsum wird verneint. Allergien und Lebensmittelunverträglichkeiten wurden ausgeschlossen. Früherkennungsuntersuchungen werden durchgeführt. Gynäkologische Vorgeschichte irrelevant (männlicher Patient). Der Impfstatus gegen COVID-19 ist vollständig und der allgemeine Impfstatus aktuell. Familienanamnestisch zeigen sich diverse Erkrankungen (siehe Selbstauskunft). Körperliche Aktivität liegt derzeit nicht vor, war jedoch früher vorhanden und wurde als positiv erlebt."}, "mistral-small": {"pass": true, "words": 665, "score": 1.0, "issues": [], "style": {"satz": 11.7, "fachb": 1.05, "wir": 0.0}, "text": "Herr T. stellt sich mit dem Hauptanliegen vor, dass er seit einigen Monaten unter einer zunehmenden depressiven Symptomatik leidet. Diese zeigt sich in Form von gedrückter Stimmung, ausgeprägter Freudlosigkeit sowie einem deutlichen Verlust an Interessen. Zudem berichtet Herr T., dass er zunehmend antriebsarm sei und sich erschöpft fühle. Sein Appetit habe deutlich abgenommen, was zu einer Gewichtsabnahme geführt hat.\n\nDie Symptome haben sich im Kontext seiner beruflichen Situation verschärft. Herr T. beschreibt eine hohe Arbeitsbelastung und einen erheblichen Druck, der durch seine berufliche Tätigkeit entsteht. Besonders belastend seien die Anforderungen an ihn als Führungskraft, die ihm das Gefühl geben, ständig verfügbar sein zu müssen. Dies habe zu einer starken inneren Unruhe und Rastlosigkeit geführt. Begleitend schildert er innere Anspannungen, Reizbarkeit und Wutausbrüche, die sowohl privat als auch beruflich zu Konflikten führen.\n\nBiographisch berichtet Herr T. über prägende Lebensereignisse, die seine aktuelle Symptomatik beeinflusst haben könnten. So erwähnt er eine frühe Trennung der Eltern im Kleinkindalter, bei der er den Vater als alkoholkrank erlebt habe. Diese Erfahrung habe tiefgreifende Auswirkungen auf seine emotionale Entwicklung gehabt. In der Schule habe er aufgrund von Konzentrationsproblemen und mangelnder Strukturierung Schwierigkeiten gehabt, was zu wiederholten Klassenwiederholungen führte. Auch im Studium habe er alle größeren Prüfungen einschließlich des Staatsexamens wiederholt werden müssen, was rückblickend als sehr beschämend und selbstwertmindernd erlebt wurde.\n\nHerr T. hat bereits ambulante psychotherapeutische Behandlungen in Anspruch genommen, insbesondere im Kontext seiner ADS-Symptomatik. Diese Behandlungen hätten jedoch nicht zu einer nachhaltigen Verbesserung geführt. Er beschreibt sich selbst als hochintelligent, aber gleichzeitig stark beeinträchtigt durch seine Aufmerksamkeitsdefizite und Impulsivität. Typische Symptome zeigten sich in einer erschwerten Alltagsstrukturierung, leichter Ablenkbarkeit sowie deutlichen Gedächtnisproblemen wie dem Vergessen von Namen, Terminen oder Absprachen.\n\nIn Bezug auf Ressourcen nennt Herr T., dass er gerne Sport treibt und dies als Ausgleich für seinen stressigen Beruf sieht. Besonders schätzt er die Möglichkeit, sich körperlich auszupowern und dabei abzuschalten. Zudem erwähnt er, dass ihm das Schreiben hilft, seine Gedanken zu ordnen und emotionale Belastungen besser zu verarbeiten. Ansonsten findet er Freude an der Natur und genießt es, Zeit allein zu verbringen, um zur Ruhe zu kommen.\n\nHerr T. wünscht sich während des stationären Aufenthalts eine Stabilisierung seiner emotionalen Verfassung und eine Reduktion der depressiven Symptome. Er hofft, durch die Therapie neue Strategien zur Bewältigung seines Stresslevels zu erlernen und seine Selbstwirksamkeit zu stärken. Besonders wichtig ist ihm, dass er lerne, Grenzen zu setzen und sich nicht ständig überfordern zu müssen. Er hat Befürchtungen, dass der Klinikaufenthalt möglicherweise nicht ausreichen wird, um alle Probleme zu lösen, aber er ist bereit, den ersten Schritt in Richtung Heilung zu gehen.\n\n###BEFUND###\n\nIm Gespräch offen, wach, bewusstseinsklar, zu allen Qualitäten orientiert. Konzentration subjektiv beeinträchtigt. Auffassung, Merkfähigkeit und Gedächtnis intakt. Formalgedanklich grübelnd, eingeengtes Denken mit Fokus auf berufliche Anforderungen und innere Unruhe. Keine Phobien oder Angststörungen. Zwänge sind nicht erhoben. Vermeidungsverhalten besteht hinsichtlich beruflicher Überforderung und innerer Anspannungen. Kein Anhalt für Wahn oder Sinnestäuschungen, keine Ich-Störungen (z.B. Depersonalisation, Derealisation, Dissoziation). Stimmungslage gedrückt, affektive Schwingungsfähigkeit eingeschränkt bei insgesamt depressiver Affektlage. Freudlosigkeit und Interessenverlust sind ausgeprägt. Erschöpfung ist d rheit, keine Denkverlangsamung, konkreter Fokus auf Leistungsangst sowie Überforderung durch innere Kontrollmechanismen. Keine Phobien erhoben, jedoch deutliche Anzeichen für soziale Angst bei Kommunikationssituationen wie Telefonaten, WhatsApp-Nutzung und Erscheinung in neuen Gruppen. Keine Zwänge belegt. Deutliche Vermeidungstendenz vor Situationen, in denen Aufmerksamkeit erzeugt wird (Schule, neue Gruppensituationen).\n\nKein Anhalt für Wahn oder Sinnestäuschungen, keine Ich-Störungen (z.B. Depersonalisation, Derealisation, Dissoziation) beschrieben. Stimmungslage leicht depressiv bis neutral, affektive Schwingungsfähigkeit eingeschränkt, insgesamt unsichere Affektlage geprägt von Unsicherheitsgefühlen und Nervosität. Interesse an kreativer Ausdrucksform wie Theater bleibt erhalten, zeigt aber nur sporadische Aktualität im Alltag. Erschöpfung ist nach ganztägigen Tätigkeiten spürbar, besonders nach Schultagen. Antrieb reduziert, beeinträchtigt durch hohe Selbstanforderungen und innerer Druck. Hoffnungslosigkeitsgefühl nicht ausgemacht; trotzdem fehlt es an klaren Perspektiven zur Entlastung der aktuellen Belastungsmuster.\n\nSelbstkritik und Schuldgefühle sind präsent: Die Patientin fühlt sich verantwortlich für das emotionale Klima in ihrer Familie, insbesondere gegenüber ihrem Bruder. Das Selbstwertgefühl ist stark konditioniert – abhängig von äußeren Erfolgen und positiver Rückmeldung anderer Personen. Gefühlsregulation erscheint gestört, insbesondere in Bezug auf Panikanfälle bei rhythmischen Geräuschen (misophonisch bedingte Reaktionen), die meidendes Verhalten hervorrufen können. Impulskontrolle ist allgemein gut, lediglich in Stresssituationen kann eine gewisse Unruhe auftreten.\n\nAmbivalente Haltung gegenüber therapeutischem Prozess: einerseits Bereitschaft zu Veränderung, andererseits Unsicherheit über eigene Ressourcen. Innerer Konflikt zwischen dem Bedürfnis nach Anerkennung/Acceptance und der Notwendigkeit, Grenzen zu setzen sowie eigenständiger zu enheit zunächst schwerfiel. Relevante Gesprächsinhalte\n\nZu Beginn thematisierte Frau K. ihre Reaktion auf eine Situation, die sich zwar erst kürzlich ereignete, jedoch tiefe Wurzeln in ihrer Familiengeschichte hat. Sie empfindet Unbehagen in Konfliktkonstellationen und erinnert sich lebhaft an vergangene Streitszenarien mit ihren Eltern, in denen sie sich als Kind hilflos fühlte. Diese Erinnerungen riefen Gefühle von Überforderung und mangelnder Handlungsfähigkeit hervor. Ein aktueller Besuch bei ihren Eltern verstärkte dieses Erleben nochmals: Insbesondere das impulsive Verhalten ihrer Mutter, die ständig stehen blieb, löste Stress aus und führte zu einer Auseinandersetzung, in der Frau K. ihre Bedürfnisse äußerte – was anschließend Schuldgefühle nach sich zog. Es zeigte sich ein deutliches Muster, in dem sie versucht, das Verhalten anderer Menschen zu korrigieren, um deren Wohlergehen sicherzustellen, gleichzeitig aber Angst vor negativen Reaktionen hegt. Im Verlauf wurde deutlich, dass dies möglicherweise mit einem Bedürfnis nach Kontrolle zusammenhängt und somit ihre eigene emotionale Belastung verstärkt. Im weiteren Gesprächsverlauf begann eine Arbeit mit inneren Anteilen. Dabei entstand das Bild eines fünf- bis zehnjährigen Mädchens, welches Schutzbedürftig wirkt und Nähe sucht. Dieses \"innere Kind\" wird von einem Löwen beschützt, welcher jedoch selbst unter Druck steht und Unterstützung benötigt. Die Therapeutinnen luden Frau K. ein, diese inneren Figuren wahrzunehmen und ihnen im Gespräch Raum zu geben. Die Beziehung zwischen den verschiedenen Teilen gestaltete sich als komplex und von Unsicherheit geprägt. Frau K. berichtete auch davon, früher in der Schule eine extrovertierte Rolle eingenommen zu haben (\"Klassenclown\"), während sie zu Hause eher zurückhaltend war – was auf unterschiedliche Verhaltensmuster in verschiedenen Kontexten hindeutet. Immer wieder thematisierte sie Gefühle von Hilflosigkeit und Überforderung, die bereits früh in ihrem Leben auftraten sowie das Gefühl, für Dinge verantwortlich gewesen zu sein, die nicht in ihrem Verantwortungsbereich lagen. Es wurde betont, wie wichtig es ist, sich von dieser Verantwortung zu lösen und stattdessen das eigene Wohlbefinden in den Fokus zu rücken. Die Patientin erkundigte sich nach einer möglichen Diagnose angesichts ihrer Reaktion auf bestimmte Reize (wie Husten), woraufhin die Therapeut*innen darauf hinwiesen, dass es wichtiger sei, die zugrunde liegenden Muster zu erkennen und damit umzugehen. Abschließend sprach Frau K. organisatorische Fragen bezüglich einer Verlängerung der Therapie an und erkundigte sich nach Kontakten zu einer Musiktherapeutin mit Schwerpunkt Misophonie. Hypothesen und Entwicklungsperspektiven\n\nDas beschriebene Verhalten lässt sich als Schutzreaktion verstehen, die aus frühen Erfahrungen resultiert und dazu dient, potenzielle Verletzungen abzuwenden."}, "mistral-small": {"pass": false, "words": 470, "score": 0.8, "issues": ["Sektion fehlt: 'Hypothesen' (auch keine Synonyme gefunden)", "Sektion fehlt: 'Einladungen' (auch keine Synonyme gefunden)"], "style": {"satz": 20.3, "fachb": 0.64, "wir": 0.0}, "text": "Auftragsklärung\n\nFrau S. beschreibt eine Situation an der Rende, die sie als positiv empfunden hat, da diese keine negativen Emotionen ausgelöst hat. Sie berichtet jedoch, dass sie Konflikte und Streitsituationen generell hasst und sich unwohl fühlt, wenn sie spürt, dass es anderen nicht gut geht. Besonders belastend sind für Frau S. Erinnerungen an frühere Situationen, in denen ihre Eltern gestritten haben und sie sich überfordert fühlte. Diese Erinnerungen werden durch aktuelle Interaktionen mit ihren Eltern getriggert, insbesondere bei deren Besuch. Frau S. schildert, wie angespannt sie sich während des Besuchs ihrer Eltern gefühlt hat und wie schwierig es für sie ist, ihre eigenen Bedürfnisse zu äußern, ohne dabei negative Reaktionen zu provozieren. Ziel des Gesprächs war es daher, Unterstützung darin zu finden, besser mit diesen emotional belastenden Situationen umzugehen und ihre eigenen Bedürfnisse klarer kommunizieren zu können. Relevante Gesprächsinhalte\n\nZu Beginn der Sitzung erinnert sich Frau S. an frühere Konfliktsituationen, in denen ihre Eltern gestritten haben und sie sich hilflos und überfordert fühlte. Sie beschreibt konkrete Bilder aus ihrer Kindheit, wie etwa ihren Vater weinend auf der Treppe sitzend. Diese Erinnerungen sind stark emotional aufgeladen und lösen bei ihr ein Gefühl von Überforderung und Hilflosigkeit aus. Aktuell berichtet Frau S. von einem Besuch ihrer Eltern, bei dem sie sich erneut sehr angespannt und überfordert fühlte. Details wie das impulsive Verhalten ihrer Mutter, die lange Zeit braucht, was Frau S. als störend empfand, führten zu einer Situation, in der beide Parteien schlecht gelaunt waren und Frau S. sich schlecht fühlte. Sie äussert, dass sie Angst hat, durch ihre Äußerungen negative Reaktionen zu provozieren, und daher oft zögert, ihre Bedürfnisse zu kommunizieren. Im weiteren Verlauf der Sitzung arbeitet die Therapeutin mit Frau S. daran, verschiedene innere Anteile und deren Gefühle zu identifizieren. Frau S. stellt sich vor, wie ein jüngeres Ich (ein fünf- bis sechsjähriges Mädchen) sich fühlt und welche Emotionen es in bestimmten Situationen erlebt. Dieses jüngere Ich wird als überfordert und traurig beschrieben. Die Therapeutin lädt Frau S. ein, dieses jüngere Ich in den Raum zu holen und sich damit auseinanderzusetzen. Frau S. beschreibt, wie sie sich fühlt, wenn sie diesem inneren Anteil begegnet, und wie sie versucht, diesen Teil von sich selbst zu trösten und zu beschützen. Frau S. reflektiert darüber, wie sie sich in verschiedenen Beziehungen verhält, insbesondere im Vergleich zu ihren Eltern und anderen Personen. Sie schildert, dass sie sich in der Gruppe weniger sicher fühlt als bei ihren Eltern, da sie dort mehr Menschen recht machen will und unsicher ist, was diese über sie denken könnten. Diese Unsicherheit führt dazu, dass sie sich oft zurückhält und ihre Bedürfnisse nicht klar kommuniziert. Körperlich spürt Frau S. während des Besuchs ihrer Eltern eine allgemeine Anspannung im ganzen Körper. Diese körperliche Reaktion wurde durch das Verhalten ihrer Mutter verstärkt, die impulsiv handelte und sich lange Zeit nahm. Frau S."}, "qwen3_6_27b": {"pass": false, "words": 261, "score": 0.8, "issues": ["Sektion fehlt: 'Hypothesen' (auch keine Synonyme gefunden)", "Sektion fehlt: 'Einladungen' (auch keine Synonyme gefunden)"], "style": {"satz": 26.1, "fachb": 2.68, "wir": 0.0}, "text": "Auftragsklärung\n\n(Thema und Ziele des Gesprächs):\nFrau S. reflektiert ihre intensive körperliche Anspannungsreaktion im Kontext von Konflikten sowie bei Begegnungen mit ihren Eltern. Ziel des Gesprächs bestand darin, diese Überforderungssituation genauer zu untersuchen, dahinterliegende innere Anteile mittels IFS-Arbeit sichtbar zu machen und neue Ressourcen für Selbstfürsorge statt externer Anpassung zu aktivieren. Es sollte geklärt werden, welche Schutzmechanismen aktuell aktiv sind und ob bereits vorhandene ressourcenreiche Teile zur Stabilisierung beitragen können. Relevante Gesprächsinhalte:\nDie Patientin berichtete über starke somatische Enge und Unsicherheit, sobald Spannungen spürbar wurden – sei dies an einer Runde während eines Familientreffens oder durch impulsives Verhalten ihrer Mutter ausgelöst. Diese Reaktionen erinnerten sie unmittelbar an frühe Kindheitserfahrungen zwischen dem fünften und zehnten Lebensjahr, in denen elterliche Streitszenarien ihr ein tiefes Gefühl der Hilflosigkeit vermittelten. Im Rahmen der Anteilsarbeit visualisierte Frau S. zunächst einen fünfjährigen Teil als trauriges Mädchen in buntem Kleid, welches angespannt und allein dastand. Als nächstes erschien ein zehnjähriges selbstbewussteres Ich aus Schulzeiten gefolgt vom Löwenanteil welcher Sicherheit spendete. Durch gezielte Platzierung dieser inneren Figuren entstand schrittweise mehr Leichtigkeit; besonders positiv wirkte sich die Präsenz des Schutzes aus. Zusätzlich zeigte sich jedoch noch weiterer Anteil voller Zweifel bezüglich Aufmerksamkeitsgewinnung innerhalb familiärer Dynamiken was weitere Bearbeitung erfordert. Insgesamt wurde deutlich dass alte Muster weiterhin bestehen bleiben aber nun differenzierter wahrgenommen werden dürfen ohne sofortige Handlungszwangsentwicklung hervorzurufen sondern eher beobachtend begleitet werden sollen damit langfristig weniger Druck entsteht sowohl nach innen hin gegen eigene Bedürfnisse auch gegenüber anderen Menschen außerhalb dieses Systems einschließlich Therapeutengruppe etcetera wo ebenfalls ähnliche Tendenzen auftreten könnten aufgrund mangelnder Vertrautheit bzw Angst vor Bewertung usw..."}, "qwen3_30b-a3b": {"pass": false, "words": 468, "score": 0.8, "issues": ["Sektion fehlt: 'Einladungen' (auch keine Synonyme gefunden)", "QUELLENTREUE: 'Manager' im Output, nicht in der Quelle (aufgestülpt)"], "style": {"satz": 21.3, "fachb": 1.07, "wir": 0.0}, "text": "Auftragsklärung\n\nDie Patientin bringt ihre aktuelle Situation bezüglich Streitsituationen und Beziehungen zu ihren Eltern sowie das Gefühl von Überforderung im Umgang mit anderen Menschen zur Sprache. Sie berichtet, dass sie bei einer gemeinsamen Aktivität mit ihren Eltern keine Triggerreaktion verspürte, jedoch bereits früher ähnliche Konfliktsituationen erlebt habe, insbesondere als Kind, wo sie beobachtete, wie ihre Eltern miteinander stritten. Die Patientin fühlt sich überfordert, wenn andere Personen unwohl sind, was ihr seit Kindheit vertraut erscheint. Relevante Gesprächsinhalte\n\nIm Gespräch entstand zunächst ein Erlebnisbericht aus einem Besuch ihrer Eltern, bei dem sie spürte, wie angespannt sie wurde – besonders beim Versuch, den Wünschen ihrer Familie gerecht zu werden. Dies löste innere Bilder aus, darunter einen Moment, als sie fünf Jahre alt war und zusah, wie ihr Vater weinte, nachdem ihre Eltern wegen ihres Bruders gestritten hatten. Diese Erinnerung zeigt deutlich, wie stark diese Erfahrungen geprägt wurden durch das Gefühl, für die Handlungen anderer verantwortlich sein zu müssen. Im Laufe des Gespräches manifestierten sich innerhalb der Therapie verschiedene Anteile, die sich als Teil der Person zeigen. Der erste Teil repräsentiert ein kleines Mädchen um die fünf Jahre alt, das hilflos wirkt („Traurig, überfordert“, sitzt auf Boden im Schneidersitz), trägt ein buntes Kleid mit Flochten und hat Angst davor, nicht genug getan zu haben. Ein zweiter Teil ist eine zehnjährige Version des Selbst, die eher selbstbewusst agiert, etwa indem sie Klassenclown spielt oder in der Schule aktiv ist; dieser Teil wird beschrieben als „kurze Hose und kurzes T-Shirt“ mit offenen Haaren. Eine dritte Figur wird als \"Löwe\" eingeführt, der stärker fordernd und schützend wirken soll. Der therapeutische Prozess konzentrierte sich darauf, diese Teile näher kennenzulernen: Wie sieht das kleine Mädchen aus? Was hat seine Gefühle? Welches Bild hat man davon? Es zeigte sich, dass das junge Mädchen (5–6 Jahre) oft alleine gelassen worden sei, während der Ältere (10 Jahre) mehr Kontrolle hatte. Beide Teile haben unterschiedliche Bedürfnisse: Das jüngere braucht Sicherheit und Fürsorge, der Ältere möchte nicht immer alles kontrollieren müssen. Im weiteren Verlauf entwickelten sich auch weitere Aspekte, zum Beispiel ein unsicherer Teil, der Angst vor anderen Menschen hat, insbesondere bei Entscheidungsproblemen. Die Patientin berichtet von einer Situation am Fitnessraum, wo sie wartend draußen blieb, weil ihre Mutter lange Zeit Bücher anschauen wollte. Sie fühlte sich dann unwohl, da sie nicht sicher war, was sie tun sollte. Hypothesen und Entwicklungsperspektiven\n\nDas Rückzugsmuster lässt sich als sinnvolle Schutzleistung eines Manager-Anteils verstehen, der früh gelernt hat, drohende Konfliktsituationen durch Vermeidung abzuwenden. Die körperlichen Symptome wie Anspannung beim Versuch, den Wünschen ihrer Familie gerecht zu werden, erscheinen dabei als somatischer Marker dieser Schutzaktivierung. Entwicklungsbezogen steht die Differenzierung zwischen dem kleinen Kind, das Sicherheit benötigt, und dem älteren Anteil, der Kontrolle sucht, im Vordergrund. Wenn beide Anteile erfahren können, dass ihr Bedarf an Sicherheit und Autonomie wahrgenommen wird, kann die Patientin schrittweise neue Beziehungserfahrungen wagen."}, "qwen3_32b": {"pass": true, "words": 496, "score": 1.0, "issues": [], "style": {"satz": 21.6, "fachb": 1.21, "wir": 0.0}, "text": "Auftragsklärung\n\nIm Gespräch standen die emotionale Reaktivität und Unsicherheitsgefühle von Frau S., insbesondere in Beziehungs- und Familienkontexten, im Vordergrund. Sie berichtet davon, wie sie sich oft überfordert fühlt, wenn Menschen um sie herum leiden, und gleichzeitig unsicher bleibt, was ihr eigenes angemessenes Verhalten sein könnte. Zentrale Fragestellung war, wie sie mit diesen Emotionen umgehen kann, ohne sich verantwortlich für andere fühlen zu müssen. Gemeinsames therapeutisches Anliegen war es, Muster früherer Verantwortlichkeitserwartungen bewusst zu machen, innere Anteile differenziert wahrzunehmen und Ansätze für einen selbstbestimmten Umgang mit Ambivalenzen zu entwickeln.\n\nRelevante Gesprächsinhalte\n\nFrau S. schilderte wiederkehrende Erinnerungen an elterliche Streitsituationen und aktuelle Konfliktsituationen innerhalb ihrer Familie, besonders zwischen Eltern und Bruder. Diese Momente lösen in ihr emotionale Reize aus, verbunden mit Unsicherheit bezüglich ihres eigenen Handelns. Ihre Empathiereaktionen wirken ambivalent: Einerseits spürt sie starke Mitgefühlsträger, andererseits führen diese Impulse zu innerer Erschöpfung. Ein Beispiel hierfür ist ein Besuch bei ihren Eltern, während dessen sie impulsiv Kritik am Atemstil der Mutter übte – danach mehrmals entschuldigte, obwohl ihre Mutter betonte, dass nichts falsch sei. Dieses Muster zeigt eine tiefe Angst vor Ablehnung und fehlender Kontrollfähigkeit in sozialen Situationen.\n\nIn der IFS-Arbeit visualisierte sie verschiedene innere Positionen als „Mädchen im Kleid“ (hilflos), „Klassenclown“ (selbstbewusst) und einen imaginären „Löwen-Anteil“, der Schutz bieten könnte. Die Spannungen zwischen diesen Teilen manifestierten sich durch Schwankungen zwischen Vertrauen und Skepsis, klaren Intuitionen einerseits und chaotischen Zweifeln andererseits. Eine zentrale Dynamik bestand darin, dass jüngere Anteile verängstigt reagieren, während ältere versuchen, sie abzuschirmen oder zu beruhigen. Körperlich spürbar waren Anspannungszustände sowie Allgemeinantriebsmangel, begleitet von ständiger Gedankenflut.\n\nHypothesen und Entwicklungsperspektiven\n\nDie emotionale Reaktivität und Unsicherheitsgefühle lassen sich verstehen als Folgen früherer Lernprozesse, in denen sie gelernt hat, für Stimmungswechsel anderer verantwortlich sein zu müssen. Der Wunsch nach Entscheidungssouveränität steht dabei im Spannungsverhältnis zur internalisierten Erwartung, andere Menschen glücklich halten zu müssen. Die Visualisierungsübungen zeigen erste Ansätze, die Distanziertheit gegenüber Emotionen abzubauen und stattdessen Vertrauensimpulse in ihre Intuitionen zu entwickeln – insbesondere wenn es um den Umgang mit inneren Konflikten geht. Entwicklungsperspektivisch ist ein Prozess von Selbstwirksamkeit und Resonanzraumbildung erkennbar: Wenn die verschiedenen inneren Positionen nicht länger isoliert bleiben können, sondern miteinander kommunizieren lernen, kann Frau S. schrittweise neue Handlungsmöglichkeiten entdecken.\n\nEinladungen\n\nFrau S. erhielt konkrete Einladungen, das Modell der inneren Anteilsarbeit weiter auszuprobieren – besonders hinsichtlich ihres „Löwen-Teils“. Ziel war es, bei unsicheren oder belastenden Momenten innezuhalten, innere Impulse symbolisch anzusprechen und so eine differenziertere Beziehung zu ihren Emotionen aufzubauen. Gleichzeitig wurde angemahnt, diese Übungen auch außerhalb des Therapieraums fortzusetzen – etwa beim Mittagessen oder in familiären Kontexten –, um die Abgrenzung gegenüber emotionalen Zuständen alltagsgewandter zu gestalten. Darüber hinaus wird angedeutet, dass mögliche externe Ressourcen wie Musiktherapie (Misophonie-Behandlung) ergänzend genutzt werden könnten, wobei dies noch konkretisiert werden muss.\n\nZur Suizidalität gibt es keine Angaben; jedoch bleibt deutlich, dass sie unter erheblicher emotionaler Belastung steht, begünstigt durch familiäre Konfliktlinien und eigene Unsicherheiten in sozialen Interaktionen. Im Abschluss zeigte sie positive Fortschritte hin zu einer besseren Selbstanpassungsfähigkeit sowie einem ersten Schritt weg vom Gefühl alleine stehen zu müssen."}}}, {"id": "dok-02-paarthematik", "wf": "dokumentation", "wfLabel": "Dokumentation", "label": "Paarthematik", "ref": {"satz": 22.0, "fachb": 0.0, "wir": 0.2}, "outputs": {"gemma3_27b": {"pass": true, "words": 445, "score": 1.0, "issues": [], "style": {"satz": 18.5, "fachb": 0.67, "wir": 0.0}, "text": "Auftragsklärung\n\nIm Zentrum des Gesprächs stand die Reflexion von Herr R. über dessen persönliches Verständnis von Glück und dessen Verortung im gegenwärtigen Moment versus zukünftiger Erwartungshaltung. Es zeigte sich ein Wunsch nach bewusster Wahrnehmung flüchtiger Wohlfühlmomente, ohne diese gedanklich zu unterbrechen. Ziel war es, diesen inneren Prozess gemeinsam weiter zu erkunden und Möglichkeiten zur Integration solcher Momente in den Alltag zu entwickeln. Relevante Gesprächsinhalte\n\nZu Beginn thematisierte Herr R. das häufige Streben nach Glück als etwas Zukünftiges und stellte die Frage nach seiner tatsächlichen Erfahrbarkeit. Dabei wurde deutlich, dass kleine Augenblicke unbeschwerter Aufmerksamkeit bereits Glücksmomente darstellen können, sofern sie frei von Gedanken erlebt werden. Im Verlauf schilderte er einen inneren Konflikt zwischen dem Bedürfnis nach Freude und einer Tendenz, durch äußere Anforderungen aus dieser Ruhe gerissen zu werden. Auch Schwierigkeiten bei der Anerkennung eigener Leistungen und einem Gefühl innerer Unruhe wurden benannt. Es entwickelte sich eine Auseinandersetzung mit Zufriedenheit als nicht dauerhaftem Zustand, sondern Teil menschlicher Vergänglichkeit. Der Begriff \"Einklang\" beschrieb dabei ein Idealbild befriedigter Bedürfnisse und daraus resultierender Freiheit. Herr R. reflektierte über dessen Empfinden sowohl in ruhigen Momenten als auch inmitten von Aktivität. Intensive emotionale Erfahrungen – wie Achterbahnfahren oder Klettern – dienten als Beispiele für Zustände fokussierter Aufmerksamkeit, in denen das Denken pausiert und unmittelbares Erleben im Vordergrund steht. Später kamen Schuldgefühle und Verantwortlichkeiten innerhalb familiärer Beziehungen zur Sprache. Es zeigte sich eine schwierige Beziehung zu Frau und Kindern, geprägt von gegenseitiger Schuldzuweisung und mangelnder Wertschätzung. Herr R. berichtete von seinem Wandel hin zur Übernahme eigener Verantwortung, betonte jedoch die Herausforderung, diese Erkenntnisse konsequent umzusetzen. Die Rolle seiner Kinder als Katalysatoren persönlicher Entwicklung wurde hervorgehoben, da sie ihn dazu anregen können, eigene Verhaltensmuster zu hinterfragen. Abschließend äußerte er den Wunsch, seine gewonnenen Erkenntnisse mit seiner Familie teilen zu können. Hypothesen und Entwicklungsperspektiven\n\nDas Streben nach Glück scheint eng verbunden mit der Suche nach einem inneren Gleichgewicht zwischen Ruhe und Aktivität sowie dem Umgang mit äußeren Anforderungen. Das Erkennen kleiner Momente des Wohlbefindens stellt einen wichtigen Schritt dar, um gegenwärtiges Erleben bewusster wahrzunehmen. Die Schwierigkeiten im Familienkontext deuten auf komplexe Beziehungsdynamiken hin, die durch wechselseitige Vorwürfe und fehlende Anerkennung gekennzeichnet sind. Eine verstärkte Fokussierung auf positive Erfahrungen und das Zulassen unbeschwerter Momente könnten dazu beitragen, innere Anteile zu beruhigen und mehr Zufriedenheit in den Alltag zu integrieren. Einladungen\n\nHerr R.  Glücksmomenten als Zustände innerer Ruhe sowie intensiver Präsenz ohne gedankliches Grübeln. Gemeinsam wurde erarbeitet, wie Herr R. solche Momente bewusster wahrnehmen und integrieren kann, anstatt sich durch auftauchende innere Anteile oder äußere Anforderungen aus dem Gleichgewicht bringen zu lassen. Ein weiterer Fokus lag darauf, Schuldzuweisungszyklen in der Partnerschaft zu deeskalieren und stattdessen einen Weg zur gemeinsamen Verantwortung und Selbstfürsorge zu finden, wobei auch die Rolle der Kinder als Spiegel eigener Entwicklungsthemen betrachtet wurde.\n\nRelevante Gesprächsinhalte\n\nHerr R. beschrieb Glücksgefühle weniger als dauerhaften Zustand, sondern als kurze Phasen des Da-Seins, etwa beim Sonnenbaden oder bei intensivem Körpererleben wie Klettern, wo kein Raum mehr für innere Kritik bleibt. Er berichtete, dass ihn oft interne Manager-Anteile (wie Zeit- oder Sozialmanager) abrupt aus diesen ruhigen Momenten reißen, wodurch er sich gestört fühlt statt entspannt. In Bezug auf seine Familie reflektierte er alte Muster: Statt seiner Frau früher pauschal die Schuld zuzuweisen, pendelte er später ins Extrem, alles selbst verantwortlich fühlen zu müssen. Nun strebt er eine ausgewogene Haltung an, in der beide Partner ihre Beiträge sehen, ohne im Vorwurf festzustecken. Die Therapeutin betonte, dass Veränderung über Wiederholung und Kontextgestaltung geschieht – nicht nur durch Willenskraft –, und lud Herrn R. dazu ein, zunächst eigene Ressourcen sichtbar werden zu lassen, bevor Erwartungen an andere gerichtet werden. Besonders entlastend wirkte der Gedanke, dass elterliche Fürsorge unabhängig vom Beziehungsverbleiben gesichert bleiben kann. Zudem erwähnte Herr R., wie das frühere Projekt „Kaninchen“ unbewusst seinen Bedürfnisraum symbolisierte – heute nutzt er Malerei ähnlich als persönlichen Rückzugsort, muss aber lernen, diese Zeiten vor familiären Umwidmungen abzugrenzen.\n\nEinladungen\n\nHerr R. wird eingeladen, bewusst jene Situationen zu notieren, n)"], "style": {"satz": 20.3, "fachb": 1.41, "wir": 0.0}, "text": "Auftragsklärung\n\nIm Mittelpunkt stand die Suche nach Wegen, mehr Einklang zwischen spontan entstandenen Glückserfahrungen und der Außenwelt herzustellen. Dabei war es wichtig herauszuarbeiten, wie man bewusster auf solche Momente reagieren kann, ohne sich von äußeren Erwartungen beeinflussen zu lassen. Zudem thematisierte Frau S., welche Rolle innere Anteile spielen können, wenn Stress oder Druck wieder aktiv werden könnten. Ziel war es, Strategien für die Balance zwischen Familie, Arbeit und persönlicher Zeit sowie für die praktische Umsetzung neuer Einsichten im Alltag zu entwickeln. Relevante Gesprächsinhalte\n\nIn der Auseinandersetzung zeigte sich, dass Frau S. zwei Arten von Glücksmomenten unterscheidet: einmal jene, bei denen sie einfach „da sein“ kann – ohne Gedanken oder Erwartungen -, andererseits intensives Erleben etwa beim Klettern oder Achterbahnfahren, wo die Aufmerksamkeit so fokussiert ist, dass Raum für Zweifel verloren geht. Beide Formate führen dazu, dass sie sich glücklich und erfüllt fühlt. Diese Erfahrung reflektierte sie vor dem Hintergrund ihrer alltäglichen Situation, besonders hinsichtlich der Balance zwischen verschiedenen Lebensbereichen. Ein weiteres zentrales Thema war das Zusammenspiel zwischen inneren Teilen und Umwelteinflüssen. So schilderte sie, wie es passiert, dass gerade in Phasen tiefer Entspannung ein Teil plötzlich etwas fordert - sei es ein Zeitmanager- oder sozialer Impuls -, was dann das Gefühl auslöst, aus einem Gleichgewicht gerissen worden zu sein. Dieses Wechselspiel zwischen Innehalten und Reaktivität wird als Herausforderung gesehen, insbesondere wenn es um die Integration von Erkenntnissen in den Alltag geht. Zur Rolle der Familie erwähnte sie, dass Kinder eine wichtige Quelle zur Reflexion eigener Handlungsweisen sind. Sie betonte, wie sehr ihr geworden ist, nicht nur die Partnerperspektive einzunehmen, sondern auch ihre eigenen Position klar zu kommunizieren. Eine zentrale Lernkurve dabei war die Auseinandersetzung mit Schuldgefühlen gegenüber ihrer Frau; später lernte sie diese aufzugreifen und einen Ausgleich anzustreben. Besonders herausgearbeitet wurde, wie sehr die gemeinsamen Kinder in diesen Prozess eingebunden waren. Auch der Umgang mit Angst und Unsicherheit kam zum Tragen. Frau S. berichtet über Momente bewusster Wahrnehmune von Ängsten, wobei humorvolles Verständnis hilfreich erscheint, ähnlich wie man Kindern Monster unter dem Bett erklärt. Zudem thematisierte sie Schwierigkeiten, emotionale Distanziertheit bei belastenden Themen (wie Todesnachrichten) zu halten, ohne abweisend wirken zu müssen. Im Gespräch tauchen mehrfach konkrete Alltagserlebnisse auf: Malerei, Klettern, Achterbahnfahren sowie der Umgang mit Haustieren (Kaninchen). Solche Aktivitäten werden genutzt, um Prozesse des Loslassens, Aufmerksamkeitsschärfe und Wertschätzung kleiner Momente zu illustrieren. Besonders hervorgehoben wird, wie solche Erfahrungen dazu beitragen können, innere Ruhe zu finden und sich von äußeren Druckquellen unabhängiger zu machen. Hypothesen und Entwicklungsperspektiven\n\nDie Fähigkeit, Glücksmomente bewusst wahrzunehmen und in den Alltag einzubinden, zeigt sich als Ressource für die Stabilisierung ihres inneren Zustands."}}}, {"id": "eb-01-depression-anteilearbeit", "wf": "entlassbericht", "wfLabel": "Entlassbericht", "label": "Depression anteilearbeit", "ref": {"satz": 22.4, "fachb": 1.44, "wir": 0.0}, "outputs": {"gemma3_27b": {"pass": true, "words": 479, "score": 1.0, "issues": [], "style": {"satz": 18.4, "fachb": 1.25, "wir": 0.08}, "text": "Zu Beginn des stationären Aufenthaltsformulierte Frau M. als zentrales Anliegen, wieder inneren Halt zu finden und sich aus einem über Jahre verfestigten Erleben von innerer Überforderung und Selbstwertzweifeln zu lösen. Wir erlebten sie zu Therapiebeginn deutlich erschöpft, innerlich angespannt und in ihrem Selbstwert erheblich verunsichert. Gleichzeitig war bereits früh eine differenzierte Selbstwahrnehmung und ein grundsätzliches Vertrauen in den therapeutischen Prozess erkennbar, was eine tragfähige Arbeitsbasis ermöglichte. Die Entdeckung eines potenziell bösartigen Muttermals kurz nach Aufnahme löste zunächst Ängste aus und führte zur Abwägung eines Abbruchs des Klinikaufenthaltes; Frau M. entschied sich jedoch für eine Fortsetzung der Behandlung, was ihre Motivation und ihren Wunsch nach Veränderung unterstrich.\n\nIm Einzelprozess stand die Auseinandersetzung mit inneren Anteilen im Zentrum. Es zeigte sich eine innere Dynamik, die durch wiederkehrende Angsterlebnisse und einen starken Perfektionismus geprägt war. Im Verlauf der Sitzungen konnte Frau M. diese inneren Ebenen zunehmend voneinander differenzieren und begann, alte Muster loszulassen. Thematisiert wurden auch Schwierigkeiten im Beziehungsbereich sowie ambivalente Gefühle bezüglich familiärer Beziehungen. Durch Trancearbeit wurde die Erkundung verschiedener Ich-Anteile gefördert, um ein tieferes Verständnis für eigene Bedürfnisse und Grenzen zu entwickeln. Körperarbeitseinheiten unterstützten das Erleben von Ruhe, Sicherheit und Schwingungsfähigkeit, während nonverbale Gruppenangebote Raum für kreativen Ausdruck und Selbstdarstellung boten. In Bezugsgruppen konnten Erfahrungen geteilt, persönliche Schwächen thematisiert und ein positives Selbstbild entwickelt werden. Die Arbeit an den Themen Grenzen setzen und Wahrnehmen trug dazu bei, dass Frau M. ihre Fähigkeit zur Selbstregulation stärken konnte.\n\nDie Gruppentherapie stellte zunächst eine Herausforderung dar; im Laufe des Aufenthalts nutzte Frau M. sie jedoch als Resonanzraum, um Beziehungsmuster zu erkennen und positive Rückmeldungen entgegenzunehmen. Insbesondere die Malmeditation ermöglichte es ihr, innere Konflikte zu reflektieren und sich mit dem Thema „innere Anteile“ auseinanderzusetzen. Auch die Auseinandersetzung mit Masken und Selbstdarstellung förderte die Entwicklung eines authentischen Auftretens. Eine Krisensituation entstand erneut durch die Entdeckung einer neuen Hautveränderung, welche jedoch gemeinsam mit dem medizinischen Team bewältigt wurde. Beratungsleistungen durch Dr. Mustermann waren hierbei besonders wertvoll.\n\nZusammenfassend zeigte sich im Verlauf der Behandlung eine deutliche Reduktion depressiver Symptomatik sowie eine Stabilisierung der Angsterlebnisse. Frau M. entwickelte einen verbesserten Zugang zu ihren Bedürfnissen, erarbeitete sich klarere Grenzen und lernte, alte Muster loszulassen. Sie konnte ihre Selbstwahrnehmung vertiefen, ihre innere Führungskraft stärken und ein größeres Maß an innerer Stabilität erreichen. Die Integration traumatischer Erfahrungen aus ihrer Kindheit – insbesondere das schwere Trauma nach einem Verkehrsunfall in jungen Jahren – erfolgte zwar nicht vollständig, aber erste Schritte zur Verarbeitung wurden unternommen.\n\nFür den weiteren Verlauf empfehlen wir eine fortlaufende ambulante Psychotherapie, um die erreichten Fortschritte nachhaltig zu festigen und neue Denk- und Handlungsmuster im Alltag zu integrieren. Im Hinblick auf die somatische Situation ist eine Wiederholung des Schlaf-Apnoe-Screenings nach etwa einem Jahr bei positiver Familienanamnese ratsam. Auch sollte weiterhin Wert auf eine gesunde Lebensweise gelegt werden, einschließlich einer ausgewogenen Ernährung und regelmäßiger Bewegung. Eine stufenweise berufliche Wiedereingliederung wird von ärztlicher und therapeutischer Seite befürwortet, sobald ausreichende Stabilisierung erreicht wurde."}, "mistral-small": {"pass": true, "words": 573, "score": 1.0, "issues": [], "style": {"satz": 18.5, "fachb": 1.75, "wir": 0.03}, "text": "Zu Beginn des stationären Aufenthaltsformulierte Frau M. als zentrales Anliegen, wieder inneren Halt zu finden und sich aus einem über Jahre verfestigten Erleben von innerer Überforderung und Selbstwertzweifeln zu lösen. Wir erlebten sie zu Therapiebeginn deutlich erschöpft, innerlich angespannt und in ihrem Selbstwert erheblich verunsichert. Gleichzeitig war bereits früh eine differenzierte Selbstwahrnehmung und ein grundsätzliches Vertrauen in den therapeutischen Prozess erkennbar, was eine tragfähige Arbeitsbasis ermöglichte.\nIm Einzelprozess stand die hypnosystemische Anteilearbeit im Zentrum. Es zeigte sich eine innere Dynamik aus stark leistungsorientierten, kontrollierenden Anteilen, die biographisch eng mit frühen Beziehungserfahrungen verknüpft waren. Diese Anteile hatten über lange Zeit eine schützende Funktion, gingen jedoch mit massiver innerer Abwertung und emotionaler Selbstentfremdung einher. Im Verlauf gelang es zunehmend, diese inneren Ebenen voneinander zu differenzieren und aus einer erwachseneren, selbstfürsorglicheren Perspektive in Kontakt zu bringen.\n\nDie therapeutischen Gruppen stellten zunächst eine erhebliche Herausforderung dar. Mit zunehmender Sicherheit nutzte sie die Gruppe als Resonanzraum, um eigene Beziehungsmuster zu erkennen. Rückmeldungen der Gruppe wirkten dabei korrigierend auf das kritisch verzerrte Selbstbild und unterstützten den Aufbau eines stabilen Selbstwertgefühls. Besonders hervorzuheben ist die Erfahrung von Frau M., die sich selbst als \"in ihr Herz gehört\" beschreibt und ein Bedürfnis gefunden hat, für das sie bewusst einen Preis einging. In der Beobachtungsphase reflektierte sie ihre Erfahrungen und integrierte sie tiefgehend.\n\nEin zentrales Thema war die Auseinandersetzung mit dem prägenden Trauma im Alter von sechs Jahren, bei dem sie schwer verletzt wurde und drei Monate im Krankenhaus verbrachte. Durch die Arbeit an diesem Erlebnis konnte sie die frühere Sinnhaftigkeit ihrer Schutzreaktionen verstehen und diese als Überlebensstrategien würdigen. Dies ermöglichte es ihr, die damaligen Erfahrungen nicht mehr ausschließlich als belastend zu erleben, sondern auch als Teil ihrer persönlichen Entwicklung zu sehen.\nFrau M. berichtete über intensive emotionale Momente während des Aufenthalts, insbesondere in Bezug auf ihre Beziehung zu ihren Eltern. Sie beschrieb berührende Momente emotionaler Resonanz und hebt hervor, erstmals konsequent sich selbst in den Mittelpunkt gestellt zu haben. Diese Erkenntnisse trugen dazu bei, eine neue, spielerisch-distanziert wertschätzende Haltung gegenüber inneren Anteilen zu entwickeln.\n\nDie traumafokussierte Arbeit umfasste auch die Anwendung von EMDR, um belastende Erinnerungen zu verarbeiten und eine Stabilisierung zu erreichen. Durch diese Methode gelang es Frau M., traumatische Erlebnisse besser zu integrieren und eine größere innere Klarheit zu gewinnen. Die Arbeit in der Gruppe non-verbal 1 und 2 sowie die Körperarbeit Einzel ermöglichten es ihr, sich Zeit für sich und Entspannung zu nehmen und eine Ausrichtung zu sich selbst und ihrem Körpererleben zu finden.\n\nEin weiterer wichtiger Aspekt war die Auseinandersetzung mit ihrer Ehe und den damit verbundenen Herausforderungen. Frau M. beschrieb eine starke Tendenz zur Rücksichtnahme und Verantwortungsübernahme, verbunden mit der Angst, den Partner zu verletzen. Dies führte langfristig zu innerer Distanz und eigener Überforderung. Im therapeutischen Prozess konnte sie lernen, klarere Grenzen zu setzen und Verantwortung abzugeben, was zu einer deutlichen Reduktion von Angst und einer neuen Selbstwertwahrnehmung beitrug.\nIm Gesamtverlauf zeigte sich eine deutliche Entwicklung hin zu mehr innerer Differenzierung, affektiver Stabilität und Selbstwirksamkeit. Frau M. stellte sich mit rezidivierender depressiver Störung vor dem Hintergrund eines prägenden Traumas im Kindesalter dar. Im stationären Rahmen konnte eine deutliche Symptomreduktion erreicht werden. Die prämorbide Persönlichkeitsstruktur mit hoher Leistungsorientierung und eingeschränkter Selbstfürsorge bleibt langfristig therapeutisch relevant.\n\nFür den weiteren Verlauf ist eine kontinuierliche ambulante psychotherapeutische Begleitung mit traumatherapeutischem Schwerpunkt dringend zu empfehlen. Insbesondere die weitere Arbeit an Beziehungs- und Selbstwertthemen sowie die achtsame Begleitung bei anstehenden Veränderungsprozessen erscheinen wesentlich, um die erreichten Fortschritte nachhaltig im Alltag zu verankern."}, "qwen3_6_27b": {"pass": false, "words": 424, "score": 0.95, "issues": ["Keyword fehlt: 'Selbstwert'"], "style": {"satz": 21.2, "fachb": 1.65, "wir": 0.05}, "text": "Zu Beginn des stationären Aufenthaltsformulierte Frau M. das zentrale Anliegen, zur innerlichen Ruhe zu finden und einen nachhaltigeren Umgang mit dem langjährigen Erleben von Grübelneigung, Perfektionsanspruch sowie starker Selbstkritik zu entwickeln. Sie berichtete, unter einem hohen Druck gelitten zu haben, alles stets kontrollieren und erledigt wissen zu müssen, was insbesondere ihre Schlafqualität erheblich beeinträchtigte und tagsüber zu Erschöpfung führte. Wir erlebten Frau M. bei Aufnahme deutlich angespannt, reflektierend und motiviert zugleich jedoch ambivalent hinsichtlich der Fähigkeit, Verantwortung abzugeben. Trotz theoretischem Vorwissen über psychodynamische Zusammenhänge schilderte sie eine Diskrepanz zwischen kognitivem Verständnis und der praktischen Umsetzung selbstfürsorglicher Haltungen. Der Fokus lag darauf, erstmals bewusster eigene Bedürfnisse wahrzunehmen statt primär für andere Sorge tragen zu wollen.\n\nIn den ersten Wochen zeigte sich, dass ihr emotionales Erleben stark durch frühe biographische Erfahrungen geprägt war. Im Kontext einer Malmeditation kam es zunächst zu intensiver Wut-Entladung verbunden mit körperlichem Schwindel, welchen sie aktiv regulierte. Gegen Jahresende trat ein Destabilisierungserlebnis zutage; Frau M. beschrieb unerträgliche Anspannung und nächtliches Erwachen mit Paniksymptomatik. In Einzelgesprächen wurde hieran anknüpfend die Kindheitsgeschichte vertieft: Die Erinnerung an den schweren Verkehrsunfall im Alter von sechs Jahren sowie die Atmosphäre eines autoritären Vaters wurden bearbeitet. Dabei erwies sich ein zuvor dämonisch empfundener Anteil zunehmend namiken Paarkontext Loyalitätskonflikten Elternhaus weiterbegleiten stufenweise berufliche Wiedereingliederung sinnvoll"}, "qwen3_30b-a3b": {"pass": true, "words": 533, "score": 1.0, "issues": [], "style": {"satz": 21.3, "fachb": 2.25, "wir": 0.0}, "text": "Zu Beginn des stationären Aufenthaltsformulierte Frau M. als zentrales Anliegen, wieder inneren Halt zu finden und sich aus einem über Jahre verfestigten Erleben von innerer Überforderung sowie Selbstwertzweifeln zu lösen. Sie beschrieb ein anhaltendes Kreisen der Gedanken insbesondere nachts verbunden mit starkem Druck, alles im Griff zu haben, was ihre Schlafstörungen verstärkte. Zu Therapiebeginn zeigte sie deutliche Erschöpfung, innere Spannung und eine reduzierte Schwingungsfähigkeit bei affektiver Belastbarkeit durch Traurigkeit, Angst und Wut gegen sich selbst. Gleichzeitig war ihr reflektierter Umgang mit ihren Gefühlen erkennbar, wobei sie einen hohen Anspruch an sich selbst stellte und zugleich Schwierigkeiten hatte, diese Grenzen bewusst abzugrenzen.\n\nIm Einzelprozess stand die Anteilearbeit im Zentrum ihrer therapeutischen Arbeit. Es erwies sich dabei eine schützende Dynamik zwischen kontrollorientierten Anteilen, die biografisch eng mit frühen Erfahrungen einer emotional wechselhaften Familie verwoben waren. Diese Anteile hatten vor allem die Funktion, emotionale Nähe und Verletzlichkeit streng zu regulieren um frühere Erfahrungen von Kontrolle und Kränkung nicht mehr riskieren zu müssen. Zugleich ging dieser Innenschutz mit massiver Selbstabwertung und Einschränkung lebendiger Beziehungsgestaltung einher. Im Laufe des Aufenthaltes gelang es zunehmend, diesen inneren Schutzanteil differenzierter anzusehen und ihn nicht länger ausschließlich als hinderndes Symptom sondern als Ausdruck einer früher notwendigen Bewältigungsstrategie zu begreifen.\n\nDie hypnosystemische Arbeitsweise unterstützte Frau M., körperliche Beschwerden wie Tinnitus oder Restless-Legs-Syndrom als Bedürfnisrückmeldung zu interpretieren. So lernte sie beispielsweise, dass das nächtliche Herzrasen und motorische Unruhe der Beine auf ungeduldige Impulse hinwiesen, welche in ihrem Alltag oft unterdrückt wurden. Durch Ressourcenaktivierung konnten diese Körperempfindungen langsam als sinnvolles Signal für bedarfsmäßiges Handeln wahrgenommen werden statt lediglich als belastender Symptomkomplex.\n\nIn den Gruppensitzungen entwickelten sich zunächst erhebliche Herausforderungen bezüglich der eigenen Positionierung. Mit zunehmender Sicherheit nutzte sie die Gruppe als Resonanzraum zur Erkenntnis eigener Beziehungsmuster. Rückmeldungen aus dem Therapiekontext wirkten korrigierend auf das kritisch verzerrte Selbstbild und trugen dazu bei, ein stabileres Gefühl für ihre innere Stärke zu gewinnen. Besonders wichtig wurde hierbei auch die Reflexion über die Familienatmosphäre sowie deren spätere Übertragung in Partnerschaftskontakte.\n\nBesondere Beachtung fand die Biographiearbeit hinsichtlich des prägenden Traumas durch einen schweren Verkehrsunfall im Alter von sechs Jahren. Dieser erlebte Zusammenhang war verbunden mit starkem Angstgefühl und Einsamkeit während eines dreimonatigen stationären Aufenthalts. In therapeutischer Arbeit konnte Frau M. eine neue Perspektive darauf finden: Sie verstand nun, dass ihr früh entdecktes Empfinden für andere Gefühlsregungen – insbesondere gegenüber einem emotional wechselhaften Vater – letztlich eine schützende Funktion hatte, um Kontrolle über äußeres Chaos zu behalten. Diese biografischen Erfahrungen wurden damit neu miteinander verbunden und ermöglichten eine stärkere Verankerung ihres aktuellen Selbstwertgefühls.\n\nIm Gesamtverlauf zeigte sich eine deutliche Entwicklung hin zu mehr innerer Differenzierung, affektiver Stabilität und Selbstwirksamkeit. Die früher dominanten Anteile kontrollierten nicht länger alle Entscheidungsprozesse sondern gingen stattdessen in eine kooperative Balance zwischen Schutzbedürfnissen und neuen Möglichkeiten über. Der Umgang mit beruflichen Anforderungen wie etwa der gemeinsamen Filmproduktion mit ihrem Bruder gestaltete sich weniger angespannt; zugleich gelang es ihr, ihren Ehemann besser wahrzunehmen ohne ihn gleichzeitig vorzuwerfen oder selbstständig zu verantworten.\n\nFür den weiteren Verlauf ist eine ambulante psychotherapeutische Begleitung dringend empfohlen, welche sowohl traumafokussierte Elemente integrieren sollte als auch weitere Arbeit am Selbstwert- und Beziehungsmodell unterstützen wird. Insbesondere erscheint es sinnvoll, die erlernten Ressourcen aktiv im Alltag einzusetzen und dabei bewusste Abgrenzungsschritte zur Entlastung ihrer Belastbarkeit fortzusetzen."}, "qwen3_32b": {"pass": true, "words": 680, "score": 1.0, "issues": [], "style": {"satz": 20.0, "fachb": 1.76, "wir": 0.03}, "text": "Zu Beginn des stationären Aufenthaltes formulierte Frau M. als zentrales Anliegen, wieder inneren Halt zu finden und sich aus einem über Jahre verfestigten Erleben emotionaler Überforderung, Selbstwertdynamiken und Trauma-bedingter Unruhe zu lösen. Wir erlebten sie zu Therapiebeginn deutlich erschöpft, innerlich anspannungsvoll und in ihrem Selbstwert erheblich verunsichert. Affektiv zeigte sich eine Mischung aus Traurigkeit, Angstgefühlen sowie latentem Ärger, verbunden mit Schlafstörungen, nächtlichen Erwachensituationen mit Herzrasen und motorischer Unruhe der Beine. Tagsüber beschrieb sie Müdigkeit, Nervosität und Konzentrationsschwierigkeiten. Gleichzeitig war bereits früh erkennbar, dass sie ein grundsätzliches Interesse am therapeutischen Prozess hatte und bereit war, sich intensiv damit auseinanderzusetzen.\n\nIm Einzelprozess stand die hypnosystemische Arbeit mit inneren Anteilen im Zentrum. Es zeigte sich eine innere Dynamik zwischen stark leistungsorientierten, kontrollierenden Anteilen und verletzten, wütenden Ebenen, die biografisch eng verwoben waren mit frühen Erfahrungen in ihrer Familie. Diese Anteile hatten über lange Zeit eine schützende Funktion, gingen jedoch mit massiver innerer Abwertung, emotionaler Distanziertheit und eingeschränkter Lebendigkeit einher. Im Verlauf gelang es zunehmend, diese inneren Ebenen voneinander zu differenzieren und aus einer erwachseneren Perspektive in Kontakt zu bringen. So identifizierte sie beispielsweise einen perfektionismusgetränkten Anteil, der versuchte, Kontrolle durch Leistungserbringung zu erreichen; parallel dazu existierten aber auch verletzte, angstvolle und wütende Facetten, denen kaum Raum gegeben wurde. Diese Erkenntnis ermöglichte es ihr, ihre Symptomatik nicht länger als feindlichen Eindringling zu betrachten, sondern als Teil einer komplexeren inneren Struktur anzuerkennen. Sie begann, den Tod – ursprünglich als bedrohliches Monster wahrgenommen – als neutralen Symbolträger für Kontrollverlust und mangelnde emotionale Co-Regulation in ihrer Kindheit zu verstehen. Dies stellte einen Meilenstein dar: Die Integration traumatischer Inhalte statt deren Ablehnung setzte ein.\n\nDie therapeutischen Gruppen stellten zunächst eine Herausforderung dar – insbesondere aufgrund ihres Bedürfnisses nach Sicherheit und klaren Grenzen. Mit zunehmender Stabilität nutzte sie das Gruppensetting als Resonanzraum für eigene Beziehungsmuster. Rückmeldungen anderer Klientinnen wirkten korrigierend auf das kritisch verzerrte Selbstbild und unterstützten den Aufbau eines stabileren Selbstwertgefühls. In Workshops zur Externalisierung symbolisierte sie weibliche Bezugspersonen wie Mutter oder Großmutter durch einen Löwen, der für Stärke stand; gleichzeitig sehnte sie sich danach, diesen Teil ruhiger werden zu lassen. Intensive Mal- und Zeichentechniken halfen ihr dabei, Trauer und Wut ausdrücken zu lernen – was sehr belastend, letztlich aber befreiend wirkt. Ihre Arbeit galt als intensiv, doch positiv bewertet: Sie regulierte sich selbst durch Farbauswahl und Formgebung. Körperarbeit spielte zudem eine zentrale Rolle bei der Regulation von Emotionen. Bei B.Schmitt-Demir arbeitete sie an der Integration von Gefühlen durch körperliche Wahrnehmunelemente, etwa im Umgang mit dem Problem des wiederkehrenden Autobeschädigungsereignisses, wo sie Strategien entwickelte, um ohne Rückfall in alte Mustern („Stell dich nicht so an“) damit umzugehen.\n\nIm Gesamtverlauf zeigte sich eine deutliche Entwicklung hin zu mehr innerer Differenzierung, affektiver Stabilisierung sowie Selbstwirksamkeit. Frau M. berichtete von einem Prozess des Lernens, Angst besser zu verstehen, einen anderen Umgang damit zu entwickeln und innere Sicherheit aus sich heraus zu generieren statt ausschließlich im Außen suchen zu müssen. Sie erkannte, dass Angst ein regulierbares Gefühl sein kann, das nicht vollständig verschwinden muss, solange es nicht leitend wirkt. Diese Einsicht ermöglichte es ihr, Entscheidungen zunehmend aus Selbstvertrauen statt aus Angst zu treffen. Gleichzeitig setzte sie Strategien zur Selbstanwendung ein (Gefühlsbenennung ohne Bewertung), experimentierte mit Grenzzugängen und suchte nach neuen Ausdrucksweisen für Emotionen. Im Gruppenkontext stellte sie fest, dass es hilfreich sei, eigene Muster im Hier-und-Jetzt reflektiert zu machen und alternative Erfahrungen zu sammeln. Perspektivisch könnte eine gemeinsame Intervention mit dem Partner sinnvoll sein, um ihn in ihren Prozess einzubeziehen.\n\nFür die weitere ambulante Begleitung ist eine kontinuierliche psychotherapeutische Unterstützung dringend zu empfehlen. Insbesondere die Fortsetzung der Anteilsarbeit, die achtsame Begleitung bei anstehenden Veränderungsprozessen sowie die Integration bislang abgespaltener Ebenen erscheinen wesentlich, um die erreichten Fortschritte nachhaltig im Alltag verankern zu können. Eine gemeinsame Intervention mit dem Partner könnte zudem sinnvoll sein, um ihn in ihren Prozess einzubeziehen. Perspektivisch wäre auch eine stationäre Wiederaufnahme im Sinne einer Intervalltherapie denkbar, falls notwendige Ressourcenentwicklung oder Krisenintervention erforderlich sind. Insgesamt wurde sie eingeladen, Veränderung als Beziehungsgeschehen – besonders zu sich selbst – zu begreifen, statt als Leistung oder Zwang anzusehen. Dieser Ansatz half ihr dabei, mehr Freundlichkeit, Geduld und Humor gegenüber sich selbst zu entwickeln."}}}, {"id": "eb-02-ads-trennung", "wf": "entlassbericht", "wfLabel": "Entlassbericht", "label": "Ads trennung", "ref": {"satz": 21.2, "fachb": 0.64, "wir": 0.0}, "outputs": {"gemma3_27b": {"pass": true, "words": 580, "score": 1.0, "issues": [], "style": {"satz": 19.3, "fachb": 1.21, "wir": 0.03}, "text": "Zu Beginn des stationären Aufenthaltes zeigte sich Herr R. deutlich erschöpft und in seinem Selbstwert erheblich verunsichert. Er formulierte das Ziel, wieder inneren Halt zu finden und sich aus einem über Jahre verfestigten Erleben von Überforderung und Selbstzweifeln zu lösen. Bereits früh erkennbar war ein grundsätzliches Vertrauen in den therapeutischen Prozess, was eine tragfähige Arbeitsbasis ermöglichte. Im Rahmen der Bezugsgruppe konnte er sich zunehmend dem Austausch widmen und erste Schritte zur Klärung aktueller Themen unternehmen, wobei der Wunsch nach Balance im Vordergrund stand. Die Arbeit mit autobiographischen Kapiteln diente dazu, eine Ausrichtung für die kommende Woche zu entwickeln.\n\nIm Einzelprozess rückte schnell die Auseinandersetzung mit seinen inneren Anteilen ins Zentrum. Es zeigte sich eine Dynamik aus stark leistungsorientierten, kontrollierenden Teilen, die biographisch eng mit frühen Beziehungserfahrungen verbunden waren. Diese Anteile schienen eine schützende Funktion gehabt zu haben, gingen jedoch mit massiver innerer Abwertung und emotionaler Entfremdung einher. In Gesprächen wurde insbesondere ein als \"Türsteher\" bezeichneter Anteil thematisiert, der offenbar aktiv andere Teile blockierte und so einen Zugang zu Gefühlen erschwerte. Durch gezieltes Benennen und Untersuchen dieser inneren Strukturen gelang es Herrn R., diese voneinander zu differenzieren und allmählich eine erwachsenerere, selbstfürsorglichere Perspektive einzunehmen. Auch nonverbale Methoden wie Körperarbeit trugen dazu bei, die Verbindung zum eigenen Erleben wiederzufinden und den Zugang zu Bedürfnissen zu öffnen.\n\nDie Gruppentherapien stellten zunächst eine Herausforderung dar, boten aber gleichzeitig wertvolle Möglichkeiten zur Selbstreflexion. Herr R. nutzte die Gruppe zunehmend als Resonanzraum, um eigene Beziehungsmuster zu erkennen und Rückmeldungen von Mitklienten anzunehmen. Insbesondere in der Kunsttherapie fand er einen Ausdruck für schwierige familiäre Erfahrungen, insbesondere im Umgang mit einem alkoholkranken Vater. Die Auseinandersetzung mit dem Thema Schuld und Scham in der nonverbalen Gruppe ermöglichte ihm, neue Bewegungsmöglichkeiten wahrzunehmen und sich von alten Lasten zu befreien. Im Laufe des Aufenthalts kristallisierte sich zudem das zentrale Entscheidungsthema Trennung von seiner Partnerin heraus, welches er aktiv in der Bezugsgruppe bearbeitete.\n\nIm Verlauf konnte Herr R. seine Aufmerksamkeit immer mehr auf sich selbst lenken und begann, ein anderes Verhältnis zu seinen inneren Zuständen zu entwickeln – weniger Abschottung, mehr Offenheit. Durch Psychoedukation zum Seitenmodell und Kybernetik sowie durch Übungen zur Achtsamkeit gelang es ihm, die Wechselwirkungen zwischen Innen- und Außenwelt besser zu verstehen. Er entwickelte Strategien, um innere Konflikte konstruktiv zu bearbeiten und die eigenen Bedürfnisse stärker wahrzunehmen. Auch die Arbeit mit Bildkarten und Hypnose trugen dazu bei, Themen zu finden und Selbstübungen zu etablieren.\n\nBei Entlassung zeigte sich Herr R. in deutlich gebesserter Verfassung, jedoch weiterhin arbeitsunfähig. Eine fachärztliche psychiatrische Mitbehandlung führte zu einer Reduktion der Sertralindosis, wodurch eine Verbesserung des Allgemeinzustandes erreicht werden konnte. Zudem wurde eine Therapie mit retardiertem Methylphenidat etabliert, welche als hilfreich empfunden wurde und im weiteren Verlauf anhand klinischer Symp  Erfahrungen emotionaler Vernachlässigung und dem Umgang mit dem alkoholkranken Vater verknüpft war. Dieser muskulöse Wächteranteil hatte lange Zeit die Funktion inne, Herrn R. vor weiterer Abwertung („faul sein“) zu schützen, führte jedoch zur Hemmung anderer Persönlichkeitsanteile und blockierte Zugang zum eigentlichen Bedürfnis nach Nähe und Anerkennung. Mithilfe des Therapiekonzepts gelang es ihm Schritt für Schritt, diese intrapsychischen Muster besser zu verstehen. Durch Trance-Übungen konnte Trauer um frühe Verluste freigesetzt werden; Kunsttherapie diente dabei als Medium zur Distanzierung und Reflexion dieser intensiven Gefühle. Der Konflikt zwischen Vermeidungsmustern und dem Wunsch nach Autonomie wurde auch am Beispiel des Antiteils „Fatman“ bearbeitet, dessen humorvolle Umdeutung Entlastung brachte. In den therapeutischen Gruppen stellten zunächst nonverbale Angebote wie Bewegungstherapie einen sicheren Raum dar, wo Schuld- und Schamthematiken körperlich verarbeitet wurden. Mit zunehmender Sicherheit nutzte Herr R. die Gruppe zunehmend als Resonanzraum, um eigene Beziehungsdynamiken einzusehen. Rückmeldungen wirkte korrigierend auf sein kritisch verzerrtes Selbstbild hin. Besonders bedeutsam erwies sich die Arbeit an aktuellen Beziehungsfragen: Angesichts akuter Trennungsandrohungen seitens seiner Partnerin kam es zu starken Druckgefühlen. Mittels Bodenanker-Skizzen transformierten wir Streitdynamiken weg von persönlicher Kritik hin zum Ausdruck ungedeuteter Bedürfnisse beider Seiten. Dies förderte spürbare körperliche Entspannung und neue Perspektiven bezüglich ihrer gemeinsamen Zukunft. Letztendlich mündete dies in einer klaren Entscheidung zugunsten räumlichen Abstandes – konkretisiert durch geplantes Kellerumziehen –, wodurch sowohl inneren Freiraum geschaffen sowie äußeren Strukturen angepasst wird. Insgesamt zeichnete sich bis Ende Januar 2026 deutliches Fortschreiten ab: Von anfänglicher Blockade entwickelte sich mehr Offenheit gegenüber eigenen E
