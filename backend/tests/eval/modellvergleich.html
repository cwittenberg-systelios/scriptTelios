es zunehmend, diese Anteile wertzuschätzen und ihre Bedeutung im Gesamtsystem zu verstehen, sodass Herr R. beginnen konnte, mehr Mitgefühl gegenüber seinem Inneren zu entwickeln.\n\nDie Gruppentherapien wurden zunächst als Herausforderung empfunden, da sie starke Ängste vor Verletzung weckten. Doch mit steigender Sicherheit nutzte Herr R. die Gruppe als Resonanzraum zur Reflexion seiner Beziehungsmuster. Insbesondere die Arbeit an dem vermeintlichen Versagen als Partner und Familienvater wurde thematisiert; hier halfen zirkuläre Fragen dazu, zwischen aktuellem Verhalten und vergangenheitsbedingtem Denken zu unterscheiden. Die Gruppenmitglieder konnten ihm zeigen, wie sein bisheriges Verhaltensmuster in den Familienbeziehungen nicht nur Folgen des ADS-Syndroms darstellte, sondern auch Ausdruck eines tief sitzenden Gefühls der Unwürdigkeit war.\n\nIn der Paartherapie kam es zu einem entscheidenden Durchbruch: Nach langjähriger Diskussion über das familiäre Ungleichgewicht – bei welchem seine Ehefrau nahezu alle organisatorischen Aufgaben übernahm – beschloss Herr R., räumlich von ihr getrennt zu leben. Dieses Entscheidungsfeld hatte lange Zeit stark blockierend auf ihn eingewirkt, weil er befürchtete, dies würde bedeuten, dass er versagt hätte. Erst nachdem er die Biographie seines Selbstwertkonzepts besser verstand, fand er Mut für diesen Schritt. Der Prozess ermöglichte einen neuen Zugang zum eigenen Wert und damit verbundene innere Stabilität.\n\nIm stationären Rahmen erreichte Herr R. deutliche Fortschritte hinsichtlich emotionaler Differenzierung sowie einer reduzierten Anspannungszustände. Seine depressive Symptomatik zeigte eine spürbare Reduktion, was durch die Testergebnisse bestätigt wurde (DASS-21 Depression 26 → 18). Gleichzeitig stellte sich ein neuer Umgang mit beruflicher Belastbarkeit heraus, indem er lernte, strukturierte Arbeitsphasen einzuplanen statt prokrastinieren zu müssen. Insgesamt gelang es ihm schrittweise, aus einer Position der Überflüssigkeit im Alltag wieder zurückzugewinnen.\n\nFür den weiteren Verlauf ist eine kontinuierliche ambulante psychotherapeutische Begleitung dringend empfohlen. Besonders wichtig erscheinen dabei die weitere Integration der Anteilearbeit ins Alltagsleben, um die neu gewonnene innere Balance stabilisieren zu können. Zudem sollte geprüft werden, ob eine verstärkte Arbeit an dem biografisch begründeten Gefühl der Unwürdigkeit mittels Trauma-fokussierten Methoden sinnvoll wäre."}, "qwen3_32b": {"pass": true, "words": 490, "score": 1.0, "issues": [], "style": {"satz": 19.6, "fachb": 1.84, "wir": 0.04}, "text": "Zu Beginn des stationären Aufenthaltes formulierte Herr R. als zentrales Anliegen, die über Jahre verfestigten Muster von innerer Überlastung, emotionaler Erschöpfung und Selbstwertdistanziertheit bewältigen zu lernen. Wir erlebten ihn zu Therapiebeginn deutlich erschöpft, innerlich angespannt und in seinem Selbstwert stark verunsichert. Gleichzeitig zeigte er früh eine differenzierte Selbstanalysefähigkeit und grundsätzliches Vertrauen in den therapeutischen Prozess, was eine tragfähige Arbeitsbasis ermöglichte.\n\nIm Einzelprozess stand die hypnosystemische Arbeit mit seinen inneren Anteilen im Zentrum. Eine zentrale Dynamik bestand aus einem leistungsorientierten Schutzanteil – der sogenannte „Türsteher“ –, dessen Funktion biografisch eng verwurzelt war in frühen Beziehungserfahrungen. Dieser Anteil hatte über lange Zeit eine schützende Rolle innegehabt, ging jedoch einher mit massiver innerer Abwertung sowie emotionaler Distanzierung. Im Verlauf gelang es, diesen Anteil voneinander abzugrenzen und aus einer erwachseneren Perspektive in Dialog zu bringen. So lernte Herr R., nicht mehr gegen diesen Anteil anzukämpfen, sondern ihn als Teil seiner inneren Landschaft zu akzeptieren und zu regulieren. Diese Arbeit half ihm, erste Zugänge zur eigenen Emotionsregulation und Selbstfürsorge zu entwickeln.\n\nDie therapeutischen Gruppen stellten zunächst eine Herausforderung dar: In der Klinikgruppe spürte er zwar Harmonie, blieb aber unsicher hinsichtlich seiner Rolle außerhalb dieses geschützten Kontexts. Mit wachsender Sicherheit nutzte er sie als Resonanzraum, um eigene Kommunikations- und Beziehungsstrukturen reflektieren zu können. Rückmeldungen der Gruppe wirkten korrigierend auf sein verzerrtes Selbstbild und unterstützten den Aufbau eines stabileren Selbstwertgefühls. Besonders kreative Formate wie Kunsttherapie oder Lagerfeuerreflexionen boten ihm Möglichkeiten, Emotionen verbalisieren zu können, die ihm vorher schwer fielen, und zugleich seine Identität stärker erfassen zu lernen.\n\nEin weiterer Fokus lag auf der Auseinandersetzung mit familiärbelastenden Mustern. Die ambivalente Beziehung zum alkoholkranken Vater sowie zur belasteten alleinerziehenden Mutter prägten nachhaltig seine Haltung gegenüber Autoritäten und das Bedürfnis nach Leistungsbewertung durch andere. Diese Erfahrungen spiegelten sich auch in seiner aktuellen Partnerschaft wider: Obwohl Harmonie in der Klinikgruppe entstand, blieb er unsicher hinsichtlich seiner Rolle außerhalb des Klinikkontextes. Der Entschluss für eine räumliche Trennung von seiner Partnerin markierte einen ersten Schritt hin zu mehr Authentizität im Umgang mit Beziehungen – weg vom Opfermodell, hin zu ehrlicher Selbstanalyse und Grenzziehung.\n\nInsgesamt zeigte sich während des stationären Aufenthalts eine deutliche Entwicklung hin zu mehr innerer Differenzierung, affektiver Stabilität und Selbstwirksamkeit. Herr R. stellte sich mit mittlerweile stabiler depressiver Episode (F33.1) und ADHS-Symptomatik (F90.0) im Kontext langjähriger Bindungsverluste und Selbstwertproblematiken vor. Innerhalb des Therapiekontextes war eine Symptomreduktion erkennbar; die prämorbide Persönlichkeitsstruktur mit hoher Leistungsorientierung bleibt jedoch langfristig therapeutisch relevant.\n\nFür den weiteren Verlauf ist eine kontinuierliche ambulante psychotherapeutische Begleitung dringend zu empfehlen. Insbesondere die weitere Arbeit an Beziehungs-, Selbstwert- und Stressbewältigungsthemen sowie die achtsame Begleitung bei anstehenden Veränderungsprozessen erscheinen wesentlich, um die erreichten Fortschritte nachhaltig verankern zu können. Eine engmaschige psychiatrische Nachbehandlung sollte parallel erfolgen, da die medikamentöse Anpassung (Methylphenidat, Sertralin) als hilfreich erlebt wurde. Zudem wäre aus unserer Sicht eine stationäre Wiederaufnahme im Sinne einer Intervalltherapie nach einiger Zeit der Alltagserprobung sinnvoll, insbesondere wenn die Arbeitsfähigkeit wiederkehrt. In diesem Zusammenhang wird eine schrittweise berufliche Wiedereingliederung, z.B. nach dem Hamburgischen Modell, unterstützt."}}}, {"id": "fva-01-borderline-folge", "wf": "folgeverlaengerung", "wfLabel": "Folgeverlängerung", "label": "Borderline folge", "ref": {"satz": 23.9, "fachb": 1.27, "wir": 0.0}, "outputs": {"gemma3_27b": {"pass": true, "words": 333, "score": 1.0, "issues": [], "style": {"satz": 22.2, "fachb": 2.7, "wir": 0.07}, "text": "Im weiteren Verlauf seit dem letzten Verlängerungsantragzeigte sich bei Frau M. ein zunehmendes Vertiefen der therapeutischen Prozesse, sowohl in Einzelsitzungen als auch in Gruppenangeboten. Insbesondere die Arbeit mit inneren Anteilskonstellationen ermöglichte es ihr, biografische Erfahrungen – wie invalidierende Beziehungsmuster aus der Kindheit und belastende Erlebnisse im Berufsfeld – differenzierter wahrzunehmen und deren gegenwärtige Auswirkungen auf ihre Symptomatik besser zu verstehen.\n\nSo konnte Frau M. im Rahmen von Körperarbeit und Stuhlarbeit einen dominanten Kontrollanteil erkennen, welcher biographisch verständlich als Schutzmechanismus vor erneuter Verletzung entstanden ist. Parallel dazu zeigten sich jüngere, vulnerable Anteile, die Gefühle von Wertlosigkeit und Trauer zum Ausdruck brachten. Durch das bewusste Wahrnehmen dieser unterschiedlichen inneren Positionen gelang es ihr schrittweise, eine Beobachterposition einzunehmen und eine wohlwollendere innere Haltung zu entwickeln. Die Integration einer externen Stellvertreterin in einem Aufstellungsformat unterstützte diesen Prozess zusätzlich, indem sie ein Gefühl von Sicherheit und Bestärkung erfuhr.\n\nIn den Gruppentherapien beteiligte sich Frau M. aktiv an Anliegen anderer Klientinnen und brachte eigene Themen vorsichtig ein. Dabei zeigte sich jedoch weiterhin eine hohe Vulnerabilität, insbesondere bei gruppalen Triggern oder Konfliktsituationen, was auf eine noch nicht vollständig stabilisierte Selbstregulation hindeutet. Sie experimentierte mit verschiedenen Strategien zur Emotionsregulation, wie beispielsweise dem Einsatz von Klanginstrumenten oder der achtsamen Wahrnehmung körperlicher Empfindungen. Auch die Auseinandersetzung mit eigenen Grenzen und Bedürfnissen wurde intensiviert, wobei sie zunächst Schwierigkeiten hatte, diese klar zu kommunizieren und abzugrenzen.\n\nDie Beschäftigung mit dem Thema Selbstverletzung setzte sich fort, wobei Frau M. zunehmend in der Lage war, auslösende Situationen frühzeitig zu erkennen und alternative Bewältigungsstrategien anzuwenden. Im Rahmen eines Paargesprächs konnte zudem ein erster Schritt zur Verbesserung der partnerschaftlichen Kommunikation eingeleitet werden. Insgesamt zeigt Frau M. erste positive Entwicklungen hinsichtlich ihrer emotionalen Stabilität, Reflexionsfähigkeit und Selbstwirksamkeit. Dennoch besteht weiterhin Bedarf an therapeutischer Begleitung, um die erarbeiteten Ressourcen weiter zu festigen und eine nachhaltige Stabilisierung für den ambulanten Kontext zu gewährleisten. Eine Verlängerung des stationären Aufenthalts um weitere 14 Tage erscheint uns daher dringend indiziert, um diesen Prozess abzuschließen und Frau M. optimal auf ihre Rückkehr in den Alltag vorzubereiten."}, "mistral-small": {"pass": true, "words": 244, "score": 1.0, "issues": [], "style": {"satz": 18.8, "fachb": 4.1, "wir": 0.46}, "text": "Im weiteren Verlauf seit dem letzten Verlängerungsantragerlebten wir Frau M. zunehmend erschöpft und in ihrem Selbstwert erheblich verunsichert. Gleichzeitig zeigte sie jedoch auch eine zunehmende Bereitschaft, sich auf den therapeutischen Prozess einzulassen und sehr vulnerable innere Themen zu explorieren.\n\nIn den hypnosystemischen Einzelprozessen konnten wir mithilfe der Anteilearbeit insbesondere einen dominanten Kontrollanteil differenzieren, der biographisch vor dem Hintergrund von invalidierenden Beziehungserfahrungen in der Herkunftsfamilie verständlich wurde. Parallel dazu traten jüngere, verletzliche Anteile in Erscheinung, die mit starken Gefühlen von Wertlosigkeit und Trauer einhergingen. Durch Stuhlarbeit, Netzwerk- und Körperarbeit gelang es uns gemeinsam mit Frau M., in ersten Schritten eine Beobachterposition einzunehmen und eine wohlwollendere innere Haltung aufzubauen.\n\nIn den therapeutischen Gruppen erlebten wir Frau M. zunehmend aktiv und beziehungsfähig. Gleichzeitig führten gruppale Trigger und Nähe-Distanz-Themen wiederholt zu Überlastung, was die weiterhin hohe Vulnerabilität des Systems unterstreicht. Besonders herausfordernd waren Situationen, in denen sie sich durch Mobbing-Erfahrungen aus ihrer Schulzeit und Konflikte mit ihren Eltern überfordert fühlte. Diese Erfahrungen lösten intensive emotionale Reaktionen aus, die oft in selbstverletzendem Verhalten wie Beißen oder Kratzen resultierten.\n\nInsgesamt sehen wir erste positive Entwicklungen wie eine verbesserte Reflexionsfähigkeit, punktuell aufgehellte Stimmung und wachsendes Verständnis für die Funktionalität alter Muster. Dennoch bestehen weiterhin hohe Anspannungszustände und eine eingeschränkte Emotionsregulation. Eine tragfähige Stabilität für den ambulanten Kontext ist derzeit noch nicht ausreichend gegeben. Zur weiteren Festigung der Steuerungsposition und Vorbereitung eines gelingenden Transfers in den häuslichen Alltag halten wir eine Verlängerung um weitere 14 Tage aus psychotherapeutischer Sicht für dringend indiziert."}, "qwen3_6_27b": {"pass": true, "words": 483, "score": 1.0, "issues": [], "style": {"satz": 23.0, "fachb": 2.07, "wir": 0.29}, "text": "Im weiteren Verlauf seit dem letzten Verlängerungsantraghaben wir bei Frau M. einen deutlichen Fortschritt in der Stabilisierung ihrer emotionalen Regulation sowie im Ausbau einer wohlwollenderen Selbsthaltung beobachtet. Wir erlebten Frau M., wie sie zunehmend fähiger wurde, innere Alarmzustände – insbesondere den dominanten Abwerteranteil – frühzeitig wahrzunehmen und durch erarbeitete Strategien zur Beruhigung beizutragen. In Einzel- und Gruppengesprächen gelang es uns gemeinsam, die frühere Sinnhaftigkeit dieses schützenden Anteils vor dem Hintergrund von Mobbing-Erfahrungen und invalidierenden Beziehungsmustern in der Herkunftsfamilie besser einordnen zu können. Durch Stuhlarbeit und hypnosystemisches Reframing konnte Frau M. erkennen, dass dieser Anteil ursprünglich dazu da war, Bindungssicherheit herzustellen und Liebesentzug abzufedern. Diese Einsicht wirkte entlastend und förderte eine zunehmende Differenziertheit zwischen aktuellen Auslösern und vergangenen Überlebensstrategien.\n\nParallel hierzu zeigten sich klinisch relevante Verbesserungen im Bereich des Körpergefühls und der Ressourcenaktivierung. Im Rahmen nonverbaler Gruppenangebote sowie kunsttherapeutischer Einheiten nutzte Frau M. symbolische Darstellungen, um verletzliche Anteile sichtbar zu machen und gleichzeitig Grenzen nach außen hin klarer abzustecken. So berichtete sie beispielsweise davon, beim Malprozess bewusst keine starren Linien gezogen zu haben, sondern spielerische Formen gewählt zu finden, was für sie Ausdruck eines wachsenden Vertrauens ins eigene Tun darstellte. Auch musikalische Elemente erwiesen sich als besonders ressourcefördernd: Beim gemeinsamen Singen oder Instrumentalspielen beschrieb Frau M. Zustände innerlicher Geborgenheit (\"am Meer stehen\"), welche ihr halfen, Anspannungszustände schneller wieder loszulassen. Solche Erfahrungen trugen maßgeblich dazu bei, dass ihre Schwingungsfähigkeit insgesamt zunahm und Rückzüge seltener wurden.\n\nIn Bezug auf das soziale Umfeld konnten erste Schritte gesetzt werden, um alte Interaktionsmuster kritisch zu hinterfragen. Besonders bedeutsam erschien dabei das Paargespräch mit ihrem Ehemann, wo beide Partner lernten, Konfliktsituationen nicht mehr ausschließlich über Schuldzuweisungen auszutragen, sondern alternative Kommunikationswege einzuprobieren (z.B. Unterbrechungstechniken). Zudem reflektierte Frau M. intensiv Themen rund um Individualität versus Verbundenheit; hierbei zeigte sich deutlich, dass sie zwar große Sehnsucht danach hatte, Teil einer Gemeinschaft zu sein, aber zugleich Angst davor verspürte, dadurch ihren eigenen Raum zu verlieren. Mit Hilfe zirkulärer Fragen arbeiteten wir daran herauszukristallisieren, wie diese beiden Bedürfnisse miteinander vereinbar gemacht werden könnten – etwa durch Installation neuer Sicherheitsnetze innerhalb ihrer Beziehungen.\n\nTrotz aller positiven Entwicklungen bestehen weiterhin Herausforderungen bezüglich der Emotionsregulation unter Stressbedingungen. Insbesondere wenn es um die Wahrnehmung eigener Bedürfnisse geht, neigt Frau M. noch immer dazu, schnell in Selbstabwertungsmuster zurückzufallen („Ich bin falsch“, „ich gehöre nicht dazu“), wodurch kurzfristig starke Unsicherheits- bis Verzweiflungsgefühle auftreten können. Dennoch sehen wir klare Ansätze dafür, dass Frau M. gelernt hat, solche Phasen besser auszuhalten statt sofort eskalierend darauf reagieren zu müssen. Ihre Fähigkeit zur Reflexion ist gestiegen ebenso wie ihr Bewusstsein darüber, wann bestimmte Glaubenssätze aktiviert werden und welchen Einfluss dies auf ihr Handeln nimmt. Eine tragfähige Stabilität im ambulanten Kontext erscheint jedoch derzeit noch fragil genug, sodass weitere Zeit benötigt wird, um neu erlernte Kompetenzen nachhaltig festigen zu lassen sowie den Transfer in den häuslichen Alltag optimal vorzubereiten. Aus psychotherapeutischer Sicht halten wir daher eine Verlängerung des stationären Aufenthalts um zusätzliche 14 Tage dringend indiziert"}, "qwen3_30b-a3b": {"pass": true, "words": 499, "score": 1.0, "issues": [], "style": {"satz": 20.8, "fachb": 2.2, "wir": 0.21}, "text": "Verlauf und Begründung der weiteren Verlängerung\n\nWir erlebten Frau M. seit dem letzten Verlängerungsantrag zunehmend ruhiger und selbstbewusster im Umgang mit alltäglichen Stressoren. Insbesondere in der Gruppentherapie am Dienstag zeigte sich ihre Fähigkeit, eigene Gedanken klar artikulieren statt zu unterdrücken. Dabei berichtete sie spontan davon, wie ihr bewusst wurde, dass sie nun aktiv Entscheidungen trifft, um ihren Bedürfnissen gerecht zu werden, was ein deutlicher Fortschritt nach längerem inneren Kampf gegen die eigenen Wünsche darstellte.\n\nIm hypnosystemischen Einzelprozess konnten wir gemeinsam das dominante Schutzsystem untersuchen, welches durch frühes Mobbing in der Schulzeit geformt worden ist. Hierbei entdeckte Frau M., dass ein Anteil namens „Wächter“ stark ausgeprägt war, dessen Funktion stets darauf gerichtet lag, alle möglichen Risiken abzuwenden. Durch Reframing gelang es uns, ihn nicht nur als bedrohliche Kontrolle wahrzunehmen, sondern vielmehr als einen schützenden Teil ihres Systems anzuerkennen. Dies führte dazu, dass er seine aggressive Haltung reduzierte und stattdessen unterstützend auftrat – beispielsweise indem er Frau M. vorübergehende Überlastung signalisierte anstatt automatisch alles zu vermeiden.\n\nParallel hierzu setzten wir EMDR bei traumatischen Erinnerungen aus ihrer Kindheit ein, besonders jenen verbunden mit einem schweren Verlust. Die Bearbeitung erfolgte vorsichtig unter Berücksichtigung ihrer aktuellen Resonanzkapazität. Nach jedem Sitzungsgespräch beschrieb Frau M. positive Veränderungen: Sie spürte weniger Druck bei den Erinnerungen und konnte diese Ereignisse neu interpretieren. So lernte sie, zwischen physischer Symptomatik (wie Kopfschmerzen) und ihrem zugrundeliegenden Gefühl des Überfordertseins zu differenzieren. Diese Einsicht nutzte sie bereits während einer stressigen Situation am Donnerstag erfolgreich, indem sie eine Atemtechnik zur Regulierung einsetzte, ohne sofort panisch zu reagieren.\n\nIn der Körperarbeit griff Frau M. verstärkt auf körperliche Signale zurück, um innere Zustände besser zu erkennen. Besonders bemerkbar wurde dies im Gespräch über Bindungsverletzungen, wo sie zum ersten Mal Traurigkeit zugeben konnte, statt sich weiterhin selbstkritisch zu behandeln. In der Bezugsgruppe entwickelte sie zunehmend Beziehungsqualitäten, insbesondere durch Austausch mit einer Kollegin, welche ähnliche Erfahrungen mit Mobbing gemacht hatte. Dadurch korrigierte sie alte Glaubenssätze bezüglich ihrer Wertlosigkeit und gewann neue Selbstwertgefühle.\n\nZu Beginn des Aufenthaltes war Frau M. von Schuld- und Schamempfindungen sowie Angst vor Ablehnung geprägt; mittlerweile zeigt sie jedoch vermehrt Bereitschaft, auch schwierige Emotionen zuzulassen. Ein Beispiel dafür ist ihr Umgang mit Trauer nach dem Gespräch über frühere Bindungsverletzungen in der Gruppentherapie. Hierbei gelang es ihr nicht nur, die Gefühle wahrzunehmen, sondern auch bewusst darauf einzugehen, was für sie bisher ungewöhnlich war. Dieser Prozess wird kontinuierlich begleitet und stützt ihre Entwicklung hin zu mehr innerem Mitgefühl.\n\nDie Arbeit mit Anteilenmodell und EMDR trug dazu bei, dass alte Belastungsmuster schrittweise losgelöst wurden. Dennoch bleibt festzuhalten, dass aktuelle Herausforderungen noch immer hohe Anspannung auslösen können – beispielsweise wenn plötzlich Stresssituationen auftreten oder emotionale Trigger aktiviert werden. Eine tragfähige Stabilität für den ambulanten Kontext ist bislang nicht erreicht: Die Nutzung von Ressourcen in alltäglichen Krisen bleibt inkonsistent, sodass weitere Unterstützung notwendig erscheint. Daher halten wir eine Verlängerung um 14 Tage dringend indiziert, um die neu erworbenen Erkenntnisse zu stabilisieren, das Gefühl der Selbstwirksamkeit weiter auszubauen und einen strukturierten Transferplan zur Vorbereitung auf den häuslichen Alltag zu erstellen."}, "qwen3_32b": {"pass": false, "words": 422, "score": 0.929, "issues": ["QUELLENTREUE: 'Verbannte' im Output, nicht in der Quelle (aufgestülpt)"], "style": {"satz": 22.2, "fachb": 2.13, "wir": 0.16}, "text": "Verlauf und Begründung der weiteren Verlängerung\n\nWir erleben bei Frau v.d.A. seit dem letzten Verlängerungsantrag einen differenzierten therapeutischen Prozess, der sowohl erste nachhaltige Verfestigungen als auch zentrale Herausforderungen zeigt. In diesem Zeitraum setzte sie ihre Arbeit am inneren Schutzsystem fort, wobei sich zunehmend Bereitschaft zeigte, vermeidende Mustern bewusst gegenüberzutreten und zugleich neue Wege der Selbstwirksamkeit zu entwickeln. Besonders hervorhebbar war hierbei die konsequente Auseinandersetzung mit Themen wie emotionaler Überlastung im beruflichen Kontext sowie der biografisch tief verwurzelten Angst vor Ablehnung oder Konflikt.\n\nIn den Einzelgesprächen gelang es gemeinsam mit Frau v.d.A., einen stark regulierenden Anteil näher zu erkunden, dessen Funktion sich historisch aus wiederholter Erfahrung von Mobbing- und Beziehungsbelastungen ableiten ließ. Dieser Anteil wirkte überdeterminiert in seiner Rolle, innere Kritik abzublocken und sozialen Kontakt möglichst neutral zu gestalten. Parallel dazu traten vermehrt verbannte Teile ihres Inneren sichtbar, die starke Gefühle von Unsicherheit, aber auch tiefe Sehnsucht nach Wertschätzung und Verbundenheit zum Ausdruck brachten. Durch hypnosystemische Interventionen und Stuhlarbeit gelang es, diese Dynamiken flexibler zu machen und erste Ansätze einer wohlwollenderen Haltung gegenüber diesen Anteilen zu etablieren – etwa durch das Einführen von Rituallen zur Selbstanrede (\"Was brauchst du gerade?\").\n\nDie Gruppensitzungen boten weitere Anknüpfungspunkte für diesen Prozess. Hier zeigten sich immer wieder Situationen, in denen Nähe-Distanz-Themen und gruppale Trigger (wie beispielsweise Diskussionen um Rollenzuschreibungen) zu erheblichen Emotionswellen führten. Gleichzeitig ist festzuhalten: Frau v.d.A. begann, solche Belastungen nicht nur besser wahrzunehmen, sondern aktiv zu modulieren. So nutzte sie körperbezogene Strategien wie Atmungstechniken oder Bewegungsübungen gezielt ein, um innere Alarmreaktionen zu stabilisieren. Auch in der Kunsttherapie entstanden Werke, die symbolisch die Spannung zwischen Vermeidungsmustern und neu erwachsendem Mut thematisierten.\n\nZudem nahmen wir eine steigende Reflexionsfähigkeit wahr, was besonders deutlich wurde bei der Bearbeitung ihrer Trennungsbiographie. Sie begann, alte Handlungsmuster (etwa die Abwertung eigener Bedürfnisse zugunsten anderer) nicht nur differenziert zu reflektieren, sondern auch alternative Lösungswege im Alltag zu probieren – etwa durch klare Kommunikation von Grenzen innerhalb des Teams. Dennoch bleibt weiterhin Ambivalenz bestehen, insbesondere wenn es darum geht, neue Erkenntnisse konsequent in den eigenen Lebenskontext zu integrieren.\n\nIm Hinblick auf die emotionale Stabilität ist festzuhalten: Trotz aller Fortschritte besteht noch ein hoher Begleitungsnachweis. Die aktuelle Ausgangslage weist zwar auf positive Veränderungen hin; jedoch sind die Ressourcen zur Bewältigung komplexer Lebenssituationen noch nicht vollständig gefestigt. Eine tragfähige Grundlage für den Übergang ins ambulante Umfeld hat sich bislang noch nicht hergestellt. Daher erscheint uns aus psychotherapeutischer Sicht eine Verlängerung des stationären Aufenthalts um 14 Tage als notwendiger Schritt, um die bereits eingeleiteten Entwicklungen weiter zu stärken und gleichzeitig neue Impulse für den Transferprozess zu setzen."}}}, {"id": "va-01-borderline-stabilisierung", "wf": "verlaengerung", "wfLabel": "Verlängerung", "label": "Borderline stabilisierung", "ref": {"satz": 23.9, "fachb": 1.27, "wir": 0.0}, "outputs": {"gemma3_27b": {"pass": true, "words": 336, "score": 1.0, "issues": [], "style": {"satz": 17.7, "fachb": 2.08, "wir": 0.32}, "text": "Im bisherigen Verlauf des stationären Aufenthaltes zeigte sich Frau M. zunächst innerlich erschöpft und von einer hohen Anspannung geprägt. Wir erlebten eine ambivalente Haltung gegenüber therapeutischen Angeboten, verbunden mit einer gleichzeitigen Bereitschaft, vulnerable innere Themen zu erkunden.\n\nIn den Einzelgesprächen konnte mithilfe der Anteilearbeit insbesondere ein starker Kontrollanteil differenziert werden, dessen Ursprung biographisch in invalidierenden Beziehungserfahrungen liegt. Parallel dazu zeigten sich jüngere, verletzliche Anteile, die mit Gefühlen von Wertlosigkeit und Trauer assoziiert sind. Durch Stuhlarbeit, Netzwerk- und Körperarbeit gelang es uns gemeinsam mit Frau M., schrittweise eine Beobachterposition einzunehmen und eine wohlwollendere innere Haltung aufzubauen. Dabei wurde deutlich, dass das Festhalten an alten Glaubenssätzen – wie dem Gefühl, nicht richtig oder wertvoll zu sein – als Schutzmechanismus gegen erneute Verletzungen dient.\n\nDie Gruppentherapien boten Frau M. Möglichkeiten zur Beziehungsgestaltung und zum Erleben korrigierender Erfahrungen. Wiederholt führten gruppale Trigger jedoch zu Überlastungssituationen, was ihre hohe Vulnerabilität unterstreicht. In nonverbalen Gruppenangeboten zeigte sie sich offen für kreative Prozesse, wobei sich immer wieder Themen des Selbstschutzes und der Abgrenzung manifestierten. Die musikalischen Angebote ermöglichten ihr einen Zugang zu emotionalen Zuständen, die zuvor schwer zugänglich waren.\n\nWir erlebten Frau M. zunehmend darin engagiert, ihre eigenen Bedürfnisse wahrzunehmen und auszudrücken. Sie begann, dysfunktionale Verhaltensmuster – wie selbstverletzendes Verhalten bei Anspannung – zu reflektieren und alternative Regulationsstrategien auszuprobieren. Auch die Auseinandersetzung mit ihrer Beziehungsmuster und den daraus resultierenden Konflikten im Elternhaus war ein wichtiger Schwerpunkt in der Therapie.\n\nInsgesamt sehen wir erste positive Entwicklungen hinsichtlich einer verbesserten Reflexionsfähigkeit, punktuell aufgehellter Stimmung und eines wachsenden Verständnisses für die Funktionalität alter Muster. Dennoch bestehen weiterhin hohe Anspannungszustände und eine eingeschränkte Emotionsregulation. Eine Alltagstauglichkeit ist derzeit noch nicht gegeben und eine tragfähige Stabilität für den ambulanten Kontext ist noch nicht erreicht. Zur weiteren Festigung der Steuerungsposition und Vorbereitung eines gelingenden Transfers in den häuslichen Alltag halten wir eine Verlängerung um weitere 14 Tage aus psychotherapeutischer Sicht für dringend indiziert. Dies ermöglicht es uns, die begonnenen Prozesse zu vertiefen und Frau M. dabei zu unterstützen, sich auch außerhalb des geschützten Rahmens stabil und handlungsfähig zu fühlen."}, "mistral-small": {"pass": true, "words": 235, "score": 1.0, "issues": [], "style": {"satz": 18.1, "fachb": 4.26, "wir": 0.46}, "text": "Im bisherigen Verlauf des stationären Aufenthaltserlebten wir Frau M. zunehmend erschöpft und in ihrem Selbstwert erheblich verunsichert. Gleichzeitig zeigte sie eine wachsende Bereitschaft, sich auf den therapeutischen Prozess einzulassen und auch sehr vulnerable innere Themen zu explorieren.\n\nIn den hypnosystemischen Einzelgesprächen konnten wir mithilfe der Anteilearbeit insbesondere einen dominanten Kontrollanteil differenzieren, der biographisch vor dem Hintergrund von invalidierenden Beziehungserfahrungen in der Herkunftsfamilie verständlich wurde. Parallel dazu traten jüngere, verletzliche Anteile in Erscheinung, die mit starken Gefühlen von Wertlosigkeit und Trauer einhergingen. Durch Stuhlarbeit, Netzwerk- und Körperarbeit gelang es uns gemeinsam mit Frau M., in ersten Schritten eine Beobachterposition einzunehmen und eine wohlwollendere innere Haltung aufzubauen.\n\nIn den therapeutischen Gruppen erlebten wir Frau M. zunehmend aktiv und beziehungsfähig. Gleichzeitig führten gruppale Trigger und Nähe-Distanz-Themen wiederholt zu Überlastung, was die weiterhin hohe Vulnerabilität des Systems unterstreicht. Besonders herausfordernd waren Situationen, in denen Frau M. ihre Grenzen setzen musste oder sich gegenüber kritischen Abwerteranteilen positionierte. Hier zeigten sich immer wieder starke emotionale Reaktionen, die sie zunächst überforderten.\n\nInsgesamt sehen wir erste positive Entwicklungen wie eine verbesserte Reflexionsfähigkeit, punktuell aufgehellte Stimmung und wachsendes Verständnis für die Funktionalität alter Muster. Dennoch bestehen weiterhin hohe Anspannungszustände und eine eingeschränkte Emotionsregulation. Eine tragfähige Stabilität für den ambulanten Kontext ist derzeit noch nicht ausreichend gegeben. Zur weiteren Festigung der Steuerungsposition und Vorbereitung eines gelingenden Transfers in den häuslichen Alltag halten wir eine Verlängerung um weitere 14 Tage aus psychotherapeutischer Sicht für dringend indiziert."}, "qwen3_6_27b": {"pass": false, "words": 294, "score": 0.786, "issues": ["Keyword fehlt: 'Anteilearbeit'", "Keyword fehlt: 'Verlängerung'", "Sektion fehlt: 'Verlängerung' (auch keine Synonyme gefunden)"], "style": {"satz": 36.8, "fachb": 3.74, "wir": 0.5}, "text": "Im bisherigen Verlauf des stationären Aufenthaltshaben wir bei Frau M., die unter einer mittelgradigen depressiven Episode sowie komplexen Belastungsreaktionen leidet, einen intensiven therapeutischen Weg begleitet. Zu Beginn nahmen wir sie deutlich erschöpft, von Grübeln geprägt und emotional stark verunsichert wahr, wobei ihr Alltag durch Antriebslosigkeit und Schuldgefühle zunehmend beeinträchtigt war. Im Fokus unserer gemeinsamen Arbeit stand zunächst die Stabilisierung ihrer Regulationsfähigkeit im Umgang mit Wut, Verzweiflung und dysfunktionalem Essverhalten, verbunden mit der Exploration eigener Bedürfnisse und berufsgrenzen. Durch hypnosystemische Verfahren, insbesondere mittels Anteilenetzwerken und Stuhlarbeiten, gelang es uns gemeinsam, innere Schutzanteile wie den „inneren Abwerter“ oder kontrollierende Teile besser einordnen zu können. Diese wurden vor dem Hintergrund früher invalidierender Beziehungserfahrungen in der Herkunftsfamilie verständlich gemacht, sodass erste Schritte hin zur Entwicklung eines wohlwollenden inneren Dialogs möglich wurden. Parallel dazu förderten körper- und kunsttherapeutische Einheiten ihren Zugang zu Ressourcen erheblich; so konnte frau m. beispielsweise mithilfe imaginativer Techniken sichere Orte finden und jüngere verletzte Anteile halten lernen. Dies führte spürbar zu Entlastungen ihres Nervensystems sowie einem wachsenden Gefühl von Sicherheit innerhalb dieser geschützten Rahmenbedingungen hier am Klinikstandort Wald-Michelbach .\n\nGleichzeitig erlebten wir auch Phasen erhöhter Vulnerabilität besonders dann wenn gruppale Trigger aktiviert wurden etwa während Konfliktsituationen zwischen Mitpatientinnen wo sich alte Muster schnell wiederholten obwohl bereits neue Bewältigungsstrategien erprobt worden waren solche Erfahrungen zeigen jedoch zugleich dass wichtige Lernprozesse stattfinden denn trotz anfänglichen Rückzugs bleibt fr au m heute fähig eigene Grenzen klarzuspüren selbst wenn diese noch nicht immer verbal kommuniziert werden konnten darüber hinaus hat sie begonnen biographisch bedingte Glaubensa sätze kritischer hinterfragen was ihre reflexionsfähigkeit insgesamt stärkt dennoch bestehen weiterhin hohe anspannungszustände eingeschränkte emotionsregulation sowie eine gewisse Unsicherheit bezüglich zukünftiger Alltagsbewältigung daher sehen wir aktuell keine ausreichende stabilität für ambulantes setting gegeben weshalb weitere vierzehn tage dringend indiziert erscheinen um transferfertigkeiten nachhaltig festigen"}, "qwen3_30b-a3b": {"pass": false, "words": 572, "score": 0.929, "issues": ["QUELLENTREUE: 'Manager' im Output, nicht in der Quelle (aufgestülpt)"], "style": {"satz": 21.2, "fachb": 1.57, "wir": 0.41}, "text": "Im bisherigen Verlauf des stationären Aufenthalts erlebten wir Frau M. deutlich angespannt und emotional überfordert durch das Erleben von Trennungsängsten nach einer jüngeren schweren Trennung vom Partner sowie einem langjährig belastenden Mobbing-Erlebnis am Arbeitsplatz. Gleichzeitig berichtete sie über ein starkes Gefühl der Wertlosigkeit und Selbstabwertung verbunden mit körperlichen Symptomen wie chronischen Kopfschmerzen und Schlafstörungen. In unseren Gesprächen stellte sich heraus, dass diese Belastungen eng verknüpft sind mit früheren Bindungsverletzungen während ihrer Kindheit insbesondere durch mangelnde emotionale Unterstützung seitens ihres Vaters bei schwierigen Lebenssituationen.\n\nMithilfe des Therapiekonzepts gelang es uns gemeinsam mit Frau M., ihre inneren Schutzreaktionen zu verstehen und schrittweise anzunehmen. Insbesondere konnten wir mittels Anteilearbeit eine dominante Kontroll- bzw. Manager-Anteile differenzieren, die biografisch aufgrund wiederholter Erfahrungen mit Vernachlässigung im Elternhaus entstanden ist. Dieser Anteil agiert aktiv zur Vermeidung weiterer Enttäuschungen und Überforderung indem er kontinuierlich hohe Anforderungen stellt und gleichzeitig Emotionen unterdrückt. Parallel dazu traten verletzte innere Zustände zutage darunter ein kleines Mädchen welches noch immer starke Traurigkeit und Angst vor Ablehnung empfindet. Durch gezieltes Reframing und Hypnosystemik haben wir versucht diesen Anteilen einen Raum für Ausdruck zu geben ohne dabei die aktuelle Sicherheitslage zu gefährden.\n\nIn den Gruppentherapien zeigte sich Frau M. zunehmend bereit eigene Themen einzubringen und soziale Resonanz zu nutzen. Besonders hilfreich war hierbei die Körperarbeit welche ihr half physische Spannungen abzubauen und zugleich mehr Bewusstsein für ihren eigenen Bedürfnissen zu entwickeln. Dennoch führten auch in dieser Umgebung Trigger aus dem Bereich Nähe-Distanz-Thematiken häufig zu Rückzug oder vermehrtem Grübeln. Wir beobachteten dass dies besonders dann geschieht wenn sie sich emotional bedrohlich fühlt oder das Gefühl hat nicht genug „gut“ sein zu müssen.\n\nIm Einzelgespräch arbeiteten wir intensiv an einer Verbesserung der Reflexionsfähigkeit sowie am Aufbau von Selbstmitgefühl gegenüber ihrem inneren kleinen Mädchen. Dabei nutzten wir spezielle Techniken aus der Stuhlarbeit um verschiedene Perspektiven wahrnehmen zu können. So lernte Frau M. langsam zwischen verschiedenen inneren Stimmen unterscheiden zum Beispiel zwischen der kritischen Stimme eines Managers (der stets sagt: „Du musst perfekt sein“) und der sanften Stimme ihres selbstwirksamen Selbsts (die leise sagt: „Es reicht schon wie du bist.“). Diese Arbeit wurde unterstützt durch EMDR-Bearbeitung des Mobbing-Erlebnisses was dazu führte dass sie nun weniger stark belastete Erinnerungen erlebt und stattdessen eine größere emotionale Differenzierung erreichen kann.\n\nZahlreiche Beispiele zeigen uns dass Frau M. bereits Fortschritte macht insbesondere im Hinblick auf ihre Fähigkeit zur Wahrnehmung ihrer Gefühle und Körpersignale als Bedürfnisrückmeldung. Sie berichtet über deutliche Entspannung bei Kopfschmerzen nach erfolgreicher Anwendung von Ressourcenaktivierungsübungen während der Therapie. Gleichzeitig bleibt jedoch festzuhalten dass ihre Emotionsregulation noch immer eingeschränkt ist vor allem unter Stressbedingungen. Die Alltagstauglichkeit ist derzeit noch nicht gegeben es fehlen klare Strategien um mit plötzlichen Belastungen umzugehen ohne sofort wieder in Überforderungszustände zu geraten.\n\nWir haben gesehen dass Frau M. zunehmend bereit ist neue Wege einzuschlagen aber gleichzeitig zeigt sich ein hoher Grad an Unsicherheit bezüglich der Zukunft. Besonders wichtig erscheint ihr die Entwicklung einer tragfähigen Stabilität für den ambulanten Kontext da bisherige Versuche außerhalb der Klinik oft zu erneuten Krisen geführt haben. Eine solche Stabilität wird erst möglich sein sobald sie sowohl innere Schutzsysteme verstanden hat als auch konkrete Handlungsmuster entwickelt welche das Gefühl der Sicherheit erhöhen.\n\nInsgesamt sehen wir erste positive Veränderungen wie verbesserte Körperbewusstsein punktuell gestärkte Reflexionsfähigkeit sowie einen beginnenden Prozess der Annahme eigener Schwächen. Dennoch bestehen weiterhin hohe Anspannungszustände und eine begrenzte Emotionsregulation. Aufgrund dieser Situation halten wir eine weitere 14-tägige stationäre Behandlungsverlängerung aus psychotherapeutischer Sicht dringend indiziert um diese positiven Impulse fortsetzen und vertiefen zu können."}, "qwen3_32b": {"pass": false, "words": 236, "score": 0.857, "issues": ["Keyword fehlt: 'Anteilearbeit'", "Keyword fehlt: 'Stabilität'"], "style": {"satz": 21.5, "fachb": 3.81, "wir": 0.64}, "text": "Wir nahmen Frau M. im bisherigen stationären Verlauf unter deutlicher emotionaler Belastung sowie einer eingeengten innerpsychischen Flexibilität auf. Gleichzeitig beobachteten wir ihre Bereitschaft, sich aktiv am therapeutischen Prozess zu beteiligen und auch sehr sensible Themenstellungen anzugehen.\n\nIm hypnosystemischen Einzelgespräch konnten wir mithilfe des Anteilemodells insbesondere einen stark regulierenden Schutzanteil identifizieren, dessen Funktion sich biographisch im Kontext früherer Erfahrungen mit Mobbing und sozialer Isolation verständlich machte. Parallel dazu traten jüngere, verletzte Anteilsstrukturen hervor, begleitet von Gefühlen tiefer Enttäuschung und Selbstabwertung. Durch systemische Stuhlarbeit, Netzwerk- und körperorientierte Ansätze gelang es uns gemeinsam mit Frau M., erste Annäherungsversuche an eine differenziertere innere Distanz einzuleiten und dabei eine achtsamere Beziehung zur eigenen Erlebenswelt herzustellen.\n\nIn den gruppendynamischen Settings erlebten wir Frau M. zunehmend partizipativ einbezogen und bereit, eigene Themen in die Gruppe einzubringen. Allerdings führten wiederkehrende Trigger aus dem Umfeld wie Nähe-Distanz-Schwankungen oder Konfliktpotentiale mehrfach zu Überlastungsreaktionen, was die nach wie vor hohe Vulnerabilität ihres Systems verdeutlichte.\n\nGesamt betrachtet stellten wir positive Fortschritte fest: etwa eine gestiegene Reflexionsfähigkeit, verbesserter Umgang mit Emotionen und wachsendes Bewusstsein für die Funktionalität alter Strategien. Dennoch bestehen weiterhin erhebliche Anspannungszustände und eine noch nicht vollständig entwickelte Fähigkeit zur Emotionsregulation. Eine tragfähige Stabilisierung, notwendig für den Übergang in den ambulanten Bereich, ist aktuell noch nicht gegeben. Aus psychotherapeutischer Sicht halten wir daher eine weitere Verlängerung um 14 Tage für dringend erforderlich, um die Steuerungsposition weiter zu stabilisieren und den Transferprozess in den häuslichen Kontext sorgfältig vorzubereiten."}}}, {"id": "va-02-angst-regression", "wf": "verlaengerung", "wfLabel": "Verlängerung", "label": "Angst regression", "ref": {"satz": 24.0, "fachb": 0.28, "wir": 0.13}, "outputs": {"gemma3_27b": {"pass": true, "words": 390, "score": 1.0, "issues": [], "style": {"satz": 19.5, "fachb": 1.54, "wir": 0.45}, "text": "Im bisherigen Verlauf des stationären Aufenthaltsnahmen wir Frau K. unter deutlicher innerer Zerrissenheit, anhaltenden Ängsten sowie wiederkehrenden depressiven Verstimmungen wahr. Bereits bei Aufnahme zeigte sich eine ausgeprägte Schwierigkeit, eigene Bedürfnisse wahrzunehmen und diese auch im zwischenmenschlichen Kontext zu äußern. Wir erlebten sie als stark leistungsorientiert mit einer hohen Tendenz zur Selbstabwertung, insbesondere im Falle vermeintlicher Misserfolge.\n\nMithilfe des Therapiekonzepts gelang es uns, gemeinsam mit Frau K., die zugrundeliegenden intrapsychischen Erlebnismuster und deren Einfluss auf ihre Symptomatik besser zu verstehen. Im Rahmen der Einzelgespräche konnten wir einen überwachenden Anteil differenzieren, welcher biographisch vor dem Hintergrund von Erfahrungen von Ablehnung und emotionaler Vernachlässigung in ihrer Kindheit verständlich wurde. Dieser Anteil schützte Frau K. davor, erneut Verletzungen zu erfahren, führte jedoch gleichzeitig dazu, dass authentische Bedürfnisse und Wünsche kaum zum Ausdruck gelangen konnten. Parallel traten jüngere Anteile in Erscheinung, welche mit Gefühlen von Hilflosigkeit, Trauer und Scham einhergingen. Durch den Einsatz systemischer Fragestellungen und Reframing-Techniken konnte Frau K. beginnen, die frühere Sinnhaftigkeit dieser Schutzmechanismen zu erkennen und alternative Verhaltensweisen auszuprobieren.\n\nIn den Gruppentherapien zeigte sich Frau K. zunehmend engagierter und beziehungsfähig. Sie beteiligte sich aktiv an Gesprächen und übernahm auch gerne unterstützende Rollen für Mitpatient*innen. Dennoch führten insbesondere Themen rund um Intimität und emotionale Nähe wiederholt zu Anspannungszuständen und Rückzugverhalten. Wir stellten fest, dass sie Schwierigkeiten hat, Grenzen zu setzen und ihre eigenen Bedürfnisse klar zu kommunizieren. Dies führt häufig zu Überforderung und Erschöpfung. Im Rahmen der Körpertherapie gelang es uns gemeinsam erste Schritte hin zur Wahrnehmung körperlicher Signale als Ausdruck unerkannter Bedürfnisse zu machen.\n\nInsgesamt sehen wir eine positive Entwicklung hinsichtlich ihrer Reflexionsfähigkeit und einer wachsenden Selbstwahrnehmung. Die depressiven Verstimmungen haben im Verlauf des Aufenthalts leicht abgenommen, jedoch bestehen weiterhin Ängste und Grübelneigungen, insbesondere in Bezug auf berufliche Herausforderungen und zwischenmenschliche Beziehungen (ICD-10: F40.1, F41.0). Eine tragfähige Stabilität für einen Übergang in den ambulanten Kontext ist derzeit noch nicht ausreichend gegeben. Zur weiteren Festigung neuer Verhaltensmuster, zur Vertiefung der Emotionsregulation sowie zur Vorbereitung eines gelingenden Transfers in ihren Alltag halten wir eine Verlängerung des stationären Aufenthaltes um weitere 14 Tage aus psychotherapeutischer Sicht für dringend indiziert. Ziel ist es, Frau K. dabei zu unterstützen, ihre i ngst und resignativer Erschöpfung pendelnd, was seine Schwingungsfähigkeit erheblich einschränkte.\n\nMithilfe unseres hypnosystemisch angelegten Therapiekonzepts gelang es uns gemeinsam mit Herr K., diese intrapsychischen Erlebensmuster und deren direkten Einfluss auf seine körperlichen Symptome besser zu verstehen. In unserer Arbeit fokussierten wir insbesondere auf Expositionsarbeit innerhalb eines geschützten Rahmens. Dabei differenzierten wir einen dominanten überwachenden Anteil, dessen Schutzfunktion darin bestand, potenzielle Bedrohungsszenarien vorwegzunehmen und so akute Panikattacken abzufangen. Biographisch wurde dieser Kontrollbedarf verständlich gemacht; frühere Erfahrungen mit unkontrollierbaren Stresssituationen hatten dazu geführt, dass Sicherheit primär durch Distanzgewinn definiert worden ist. Parallel sahen wir jüngere, verletzliche Anteile in Erscheinung treten, die mit starken Gefühlen von Hilflosigkeit und dem Gefühl „nicht sicher sein“ verbunden waren. Durch gezielte Körperarbeit und Ressourcenorientierung konnten wir erste Schritte hin zu einem embodied Feeling of Safety gehen. Es zeigte sich für Herr K., wie die ständige Alarmbereitschaft früher einmal eine sinnvolle Anpassungsleistung darstellte, um überwältigende Ängste auszuhalten. Dadurch begann er, etwas freundlicher mit seinen eigenen Reaktionen umzugehen statt sie nur als Störungen zu bewerten.\n\nIn der Gruppentherapie engagieren wir uns intensiv am Aufbau sozialer Kompetenz. Hier nahmen wir Herrn K. zunehmend aktiver teilnehmend wahr, wobei gruppale Interaktionen wiederholt Trigger für soziale Bewertungsangst setzten. Diese Momente nutzten wir therapeutisch, um Nähe-Distanz-Themen direkt anzusprechen und alternative Bewältigungsstrategien zu probieren. Uns gelang es, ihm Raum zu geben, eigene Bedürfnisse artikuliert auszudrücken anstatt zurückzugreifen auf passive Vermeidung oder intellektuelle Rationalisierung. Dennoch bleibt festzustellen, dass ohne direkte Unterstützung noch kei tionsarbeit gelang es Herrn K., diese Mechanismen schrittweise abzuschwächen und stattdessen einen Resonanzraum für innere Wahrnehmungen zu öffnen.\n\nIm Rahmen der Gruppentherapie beteiligte sich Herr K. aktiv am Gesprächsprozess und begann, soziale Kompetenzpunkte zu entdecken: Er bemerkte, dass andere Teilnehmer ebenfalls Schwierigkeiten hatten, ihre Gefühle klar auszudrücken, was ihm ermöglichte, eigene emotionale Signale mutiger wahrzunehmen und anzuerkennen. Gleichzeitig arbeiteten wir an einer differenzierten Unterscheidung zwischen seinen verschiedenen inneren Zuständen, um sein Selbstmitgefühl sukzessive zu steigern. Besonders wichtig war hierbei die Entwicklung eines bewussten Umgangs mit dem Gefühl der Überforderung, sodass er frühzeitig Ressourcen mobilisieren konnte statt in alte Muster abzugleiten.\n\nDie Rückfallprophylaxe ist aktuell stark verbunden mit der Fragestellung, wie man langfristig stabiler bleibt bei äußeren Belastungen. Hierzu wurden bereits mehrere Strategien diskutiert, darunter das Erstellen eines persönlichen Notfallschemas, das speziell auf den individuellen Lebenskontext von Herrn K. angepasst wurde. Zudem lernte er systematisch reflektieren, wann genau bestimmte Verhaltensweisen oder Gedankenmuster entstanden sind – dies half ihm nicht nur, den aktuellen Moment besser wahrzunehmen, sondern auch biografische Zusammenhänge sichtbarer werden zu lassen. So konnte er erkennen, dass viele seiner Reaktionen ursprünglich eine sinnvolle Schutzreaktion waren, bevor sie sich später zur Last gewandelt haben.\n\nInsgesamt zeichnete sich ein deutlicher Fortschritt im Bereich der Integration körperlicher Symptome in therapeutische Prozesse ab: Durch gezielte Körperarbeitsmethoden lernte Herr K., seine Anspannungszustände präziser wahrzunehmen und gleichzeitig angemessen darauf zu reagieren. Diese Fähigkeit gilt als zentral für die weitere Entwicklungsphase, da sie direkt zur Steigerung der Alltagstauglichkeit beiträgt. Zugleich stieg seine Reflex .casenav{ background:var(--panel); border:1px solid var(--line); border-radius:9px;
  padding:5px 14px; margin:16px 0 12px; }
.cgroup{ display:flex; align-items:center; gap:9px; padding:7px 0; flex-wrap:wrap; }
.cgroup + .cgroup{ border-top:1px solid var(--lineSoft); }
.cglabel{ font-size:10.5px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--accentDeep); font-weight:700; flex:0 0 134px; }
.ctab{ font-family:var(--ui); font-size:13px; font-weight:600; padding:6px 13px;
  border-radius:7px; border:1px solid var(--line); background:var(--panel2);
  color:var(--soft); cursor:pointer; }
.ctab:hover{ border-color:var(--accent); color:var(--accentDeep); }
.ctab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.ctab:focus-visible{ outline:2px solid var(--accentDeep); outline-offset:1px; }

/* comparison */
.cmp{ display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:start; scroll-margin-top:14px; }
.pane{ background:var(--panel); border:1px solid var(--line); border-radius:9px;
  display:flex; flex-direction:column; min-width:0; overflow:hidden; }
.phead{ padding:11px 13px 10px; border-bottom:1px solid var(--line);
  background:var(--panel2); }
.ptop{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; }
.pname{ font-weight:700; font-size:14px; }
.pill{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:20px;
  letter-spacing:.03em; }
.pill.pass{ background:#e3f1ea; color:var(--good); }
.pill.fail{ background:#f6e6e3; color:var(--bad); }
.pwords{ font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
  margin-left:auto; }
.chips{ display:flex; gap:6px; flex-wrap:wrap; margin-top:9px; }
.metric{ font-size:11px; color:var(--soft); background:var(--panel);
  border:1px solid var(--line); border-radius:5px; padding:3px 7px;
  font-variant-numeric:tabular-nums; }
.metric b{ color:var(--ink); }
.metric .off{ color:var(--warn); font-weight:700; }
.issues{ margin-top:9px; display:flex; flex-direction:column; gap:3px; }
.issue{ font-size:11.5px; color:var(--bad); display:flex; gap:6px; line-height:1.35; }
.issue::before{ content:"▸"; color:var(--bad); }
.issue.fid{ color:var(--bad); font-weight:600; }
.noissue{ font-size:11.5px; color:var(--good); }
.noissue::before{ content:"✓ "; }
.pbody{ padding:18px 20px 22px;
  font-family:var(--serif); color:var(--doc); font-size:14.5px; line-height:1.62;
  white-space:pre-wrap; word-wrap:break-word; }
.pbody .befund{ display:block; margin:16px 0; text-align:center; font-family:var(--ui);
  font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
  position:relative; }
.pbody .befund::before,.pbody .befund::after{ content:""; position:absolute; top:50%;
  width:38%; height:1px; background:var(--line); }
.pbody .befund::before{ left:0; } .pbody .befund::after{ right:0; }
.empty{ color:var(--muted); font-family:var(--ui); font-size:13px; }

@media (max-width:980px){
  .dash{ grid-template-columns:repeat(2,1fr); }
  .cmp{ grid-template-columns:1fr; }
  .app{ padding:14px; }
}
@media (prefers-reduced-motion:reduce){ *{ scroll-behavior:auto !important; } }
`;

function el(tag, cls, txt){ const e=document.createElement(tag);
  if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
function fmtPct(x){ return x==null ? "–" : Math.round(x*100)+"%"; }
function fmtNum(x,d){ return x==null ? "–" : Number(x).toFixed(d==null?1:d); }

const byslug = Object.fromEntries(DATA.models.map(m=>[m.slug,m]));

// ---- ratings state (Confluence content-property backed) ----
const RKEY="stx-model-ratings", ADMIN_GROUP="confluenceAdmin";
let STATE={ratings:{},names:{}}, USER=null, IS_ADMIN=false, STORE=null, STORE_OK=false;

// build shell
root.innerHTML = `<style>${CSS}</style>
<div class="app"><div class="wrap">
  <div>
    <div class="eyebrow">scriptTelios · Klinische Dokumentation</div>
    <h1 class="title">Modellvergleich</h1>
    <p class="sub">Fünf Sprachmodelle auf denselben klinischen Fällen — Tempo, Qualität, Stiltreue und die Volltexte im direkten Vergleich.</p>
    <p class="gen">Stand ${DATA.generated} · Temperatur 0,0 · alle Modelle identische Bedingungen</p>
  </div>
  <div id="notice" class="notice" style="display:none"></div>
  <section id="summary" class="rsum" style="display:none"></section>
  <section id="leaderboard" class="lb"><div class="lb-empty">Bewertungen werden geladen …</div></section>
  <div class="dash" id="dash"></div>
  <nav class="casenav" id="casenav"></nav>
  <div class="cmp" id="cmp">
    <div class="pane-wrap"><span class="pane-slot a">A</span>
      <div class="pane"><div class="phead" id="headA"></div><div class="pbody" id="bodyA"></div></div></div>
    <div class="pane-wrap"><span class="pane-slot b">B</span>
      <div class="pane"><div class="phead" id="headB"></div><div class="pbody" id="bodyB"></div></div></div>
  </div>
</div></div>`;

const $ = s => root.querySelector(s);

// selection state
let slotA="qwen3_32b", slotB="gemma3_27b";  // Default: A = Status quo, B = erstes Alternativmodell

// dashboard cards = A/B-Selektoren
const dash = $("#dash");
const dashCards = {};
DATA.models.forEach(m=>{
  const c = el("div","mcard"+(m.statusQuo?" sq":""));
  c.innerHTML = `<div class="mhead">
      <div><div class="mname">${m.name}</div><div class="mtag">${m.tag}</div></div>
      ${m.statusQuo?'<span class="sqtag">Status quo</span>':''}
    </div>
    <div class="mstrength">${m.strength}</div>`;
  const rows = el("div","mrows");
  const spd = m.speedup==null?"–":(m.speedup>=1? m.speedup.toFixed(1)+"× schneller"
              : (1/m.speedup).toFixed(1)+"× langsamer");
  const add=(k,v)=>{ const r=el("div","mrow");
    r.innerHTML=`<span class="k">${k}</span><span class="v">${v}</span>`; rows.appendChild(r); };
  add("Laufzeit", m.runtime);
  add("Tempo", spd);
  add("Score Ø", fmtPct(m.avg_score));
  add("Fidelity-Verstöße", m.fidelity);
  add("Steuerbarkeit", fmtNum(m.steer,3));
  c.appendChild(rows);
  const badge=el("div","slot-badge"); badge.style.display="none"; c.appendChild(badge);
  const chooser=el("div","chooser"); chooser.style.display="none";
  const ba=el("button","ch-a","A"); ba.onclick=(e)=>{ e.stopPropagation(); assignSlot("A",m.slug); };
  const bb=el("button","ch-b","B"); bb.onclick=(e)=>{ e.stopPropagation(); assignSlot("B",m.slug); };
  chooser.appendChild(ba); chooser.appendChild(bb); c.appendChild(chooser);
  c.onclick=(e)=>onCardClick(m.slug, e);
  dashCards[m.slug]={card:c,badge,chooser};
  dash.appendChild(c);
});
function closeChoosers(){ Object.values(dashCards).forEach(d=>d.chooser.style.display="none"); }
function onCardClick(slug, e){
  if(slug===slotA || slug===slotB){ closeChoosers(); return; }   // schon gewählt → kein Chooser
  const d=dashCards[slug]; const wasOpen=d.chooser.style.display!=="none";
  closeChoosers();
  if(!wasOpen){                                                   // drittes Modell → (A)(B) beim Cursor
    const r=d.card.getBoundingClientRect();
    d.chooser.style.left=(e.clientX-r.left)+"px";
    d.chooser.style.top=(e.clientY-r.top)+"px";
    d.chooser.style.display="";
  }
}
function assignSlot(slot,slug){
  if(slot==="A") slotA=slug; else slotB=slug;                     // verdrängt das bisherige A bzw. B
  closeChoosers(); sync();
}
function markSlots(){
  Object.entries(dashCards).forEach(([slug,d])=>{
    const isA=slug===slotA, isB=slug===slotB;
    d.card.classList.toggle("selA",isA); d.card.classList.toggle("selB",isB);
    if(isA||isB){ d.badge.style.display=""; d.badge.textContent=isA?"A":"B";
      d.badge.className="slot-badge "+(isA?"a":"b"); }
    else d.badge.style.display="none";
  });
}

let ci=0;
function curCase(){ return DATA.cases[ci]; }

// case navigation: chips grouped by workflow
const casenav=$("#casenav");
const groups=[];
DATA.cases.forEach((c,i)=>{
  let g=groups.find(x=>x.wf===c.wf);
  if(!g){ g={wf:c.wf,label:c.wfLabel,items:[]}; groups.push(g); }
  g.items.push({i,label:c.label});
});
groups.forEach(g=>{
  const row=el("div","cgroup");
  row.appendChild(el("span","cglabel",g.label));
  g.items.forEach(it=>{
    const t=el("button","ctab",it.label); t.dataset.ci=it.i;
    t.onclick=()=>{ ci=it.i; goCase(); };
    row.appendChild(t);
  });
  casenav.appendChild(row);
});
function goCase(){ sync(); $("#cmp").scrollIntoView({block:"start"}); }
function updateNav(){
  casenav.querySelectorAll(".ctab").forEach(t=>t.classList.toggle("active",+t.dataset.ci===ci));
}

function renderHead(container, slug){
  const c=curCase(); const o=c.outputs[slug]; const m=byslug[slug];
  container.innerHTML="";
  const top=el("div","ptop");
  top.appendChild(el("span","pname",m.name));
  if(!o){ container.appendChild(top);
    container.appendChild(el("div","empty","Kein Output für diesen Fall.")); return; }
  const pass=el("span","pill "+(o.pass?"pass":"fail"), o.pass?("PASS · "+fmtPct(o.score)):("FAIL · "+fmtPct(o.score)));
  top.appendChild(pass);
  top.appendChild(el("span","pwords",(o.words!=null?o.words:"–")+" Wörter"));
  container.appendChild(top);
  // style chips vs reference
  if(o.style){
    const ch=el("div","chips"); const ref=c.ref||{};
    const chip=(label,val,refv,d)=>{
      const m1=el("span","metric");
      const off = (refv!=null && val!=null && Math.abs(val-refv) > (label==="Wir"?0.15:(label==="Satz"?6:1)));
      m1.innerHTML = `${label} <b class="${off?'off':''}">${fmtNum(val,d)}</b>`
        + (refv!=null?` <span style="color:var(--muted)">/ ${fmtNum(refv,d)}</span>`:"");
      ch.appendChild(m1);
    };
    chip("Satz", o.style.satz, ref.satz, 1);
    chip("Fachbegr.", o.style.fachb, ref.fachb, 2);
    chip("Wir", o.style.wir, ref.wir, 2);
    container.appendChild(ch);
  }
  // issues
  const wrap=el("div","issues");
  if(o.issues && o.issues.length){
    o.issues.forEach(t=>{
      const isFid=/QUELLENTREUE|aufgestülpt/i.test(t);
      wrap.appendChild(el("div","issue"+(isFid?" fid":""), t));
    });
  } else {
    wrap.appendChild(el("div","noissue","Keine Eval-Beanstandungen"));
  }
  container.appendChild(wrap);
  container.appendChild(starControl(slug));
}

function renderBody(container, slug){
  const o=curCase().outputs[slug];
  container.innerHTML="";
  if(!o){ container.appendChild(el("div","empty","—")); return; }
  const parts = o.text.split("###BEFUND###");
  parts.forEach((seg,idx)=>{
    if(idx>0) container.appendChild(el("span","befund","Befund"));
    container.appendChild(document.createTextNode(seg.replace(/^\s+|\s+$/g,"")));
  });
}

function sync(){
  renderHead($("#headA"), slotA); renderBody($("#bodyA"), slotA);
  renderHead($("#headB"), slotB); renderBody($("#bodyB"), slotB);
  markSlots(); updateNav();
}

root.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight" && ci<DATA.cases.length-1){ ci++; goCase(); }
  if(e.key==="ArrowLeft" && ci>0){ ci--; goCase(); }
});
root.addEventListener("click",(e)=>{
  if(!e.composedPath().some(n=>n.classList && n.classList.contains("mcard"))) closeChoosers();
});
host.setAttribute("tabindex","0");

// ===================== Ratings (Confluence Server 7.4) =====================
function ctxPath(){ try{ return (window.AJS&&AJS.contextPath&&AJS.contextPath())||""; }catch(e){ return ""; } }
function pageId(){ try{ if(window.AJS){
    if(AJS.params&&AJS.params.pageId) return String(AJS.params.pageId);
    if(AJS.Meta&&AJS.Meta.get){ const p=AJS.Meta.get("page-id"); if(p) return String(p); }
  } }catch(e){} return null; }

function confluenceStore(ctx,pid){
  const base=ctx+"/rest/api/content/"+pid+"/property/"+RKEY;
  const coll=ctx+"/rest/api/content/"+pid+"/property";
  async function get(){
    const r=await fetch(base+"?expand=value,version",{credentials:"same-origin",headers:{Accept:"application/json"}});
    if(r.status===404) return {value:{ratings:{},names:{}},version:0,exists:false};
    if(!r.ok) throw new Error("GET "+r.status);
    const d=await r.json(); const v=d.value||{}; v.ratings=v.ratings||{}; v.names=v.names||{};
    return {value:v,version:(d.version&&d.version.number)||1,exists:true};
  }
  async function save(key,val){
    for(let a=0;a<5;a++){
      const cur=await get(); const v=cur.value;
      v.ratings[key]=v.ratings[key]||{}; v.ratings[key][USER.name]=val; v.names[USER.name]=USER.display;
      const url=cur.exists?base:coll;
      const method=cur.exists?"PUT":"POST";
      const body=cur.exists?{key:RKEY,value:v,version:{number:cur.version+1}}:{key:RKEY,value:v};
      const r=await fetch(url,{method,credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-Atlassian-Token":"no-check"},body:JSON.stringify(body)});
      if(r.ok) return v;
      if(r.status===409) continue;       // jemand hat parallel geschrieben → neu lesen + retry
      throw new Error(method+" "+r.status);
    }
    throw new Error("zu viele Schreibkonflikte");
  }
  return {get,save};
}
function memoryStore(){ let v={ratings:{},names:{}};
  return { async get(){ return {value:v,version:0,exists:true}; },
    async save(key,val){ v.ratings[key]=v.ratings[key]||{}; v.ratings[key][USER.name]=val;
      v.names[USER.name]=USER.display; return JSON.parse(JSON.stringify(v)); } }; }

async function loadUser(ctx){
  try{ const r=await fetch(ctx+"/rest/api/user/current",{credentials:"same-origin",headers:{Accept:"application/json"}});
    if(r.ok){ const d=await r.json(); if(d&&d.username) return {name:d.username,display:d.displayName||d.username}; }
  }catch(e){}
  try{ if(window.AJS&&AJS.params&&AJS.params.remoteUser){ const n=AJS.params.remoteUser; return {name:n,display:n}; } }catch(e){}
  return null;
}
async function isInAdminGroup(ctx,username){
  const target=ADMIN_GROUP.toLowerCase(), uname=username.toLowerCase();
  // 1) Gruppen des Users — Gruppennamen case-insensitiv vergleichen
  try{ const r=await fetch(ctx+"/rest/api/user/memberof?username="+encodeURIComponent(username)+"&limit=200",
        {credentials:"same-origin",headers:{Accept:"application/json"}});
    if(r.ok){ const d=await r.json();
      if((d.results||[]).some(g=>(g.name||"").toLowerCase()===target)) return true; }
  }catch(e){}
  // 2) Fallback: Mitgliederliste der Gruppe (fängt abweichende Schreibweise / verschachtelte Mitgliedschaft)
  try{ const r=await fetch(ctx+"/rest/api/group/"+encodeURIComponent(ADMIN_GROUP)+"/member?limit=1000",
        {credentials:"same-origin",headers:{Accept:"application/json"}});
    if(r.ok){ const d=await r.json();
      return (d.results||[]).some(m=>(m.username||m.name||"").toLowerCase()===uname); }
  }catch(e){}
  return false;
}
function notice(msg,kind){ const n=$("#notice"); if(!n) return;
  if(!msg){ n.style.display="none"; return; }
  n.className="notice"+(kind?" "+kind:""); n.textContent=msg; n.style.display=""; }

// --- star control in each pane header ---
function starControl(slug){
  const key=curCase().id+"::"+slug;
  const mine=(USER&&STATE.ratings[key]&&STATE.ratings[key][USER.name])||0;
  const wrap=el("div","rate");
  wrap.appendChild(el("span","rate-label",mine?"Deine Bewertung":"Diesen Text bewerten"));
  const stars=el("div","stars");
  for(let i=1;i<=5;i++){
    const s=el("span","star"+(i<=mine?" on":""),"★"); s.dataset.val=i;
    if(STORE_OK&&USER){
      s.onmouseenter=()=>{ [].forEach.call(stars.children,x=>x.classList.toggle("hot",(+x.dataset.val)<=i)); };
      s.onclick=()=>submitRating(key,i);
    }
    stars.appendChild(s);
  }
  if(STORE_OK&&USER) stars.onmouseleave=()=>{ [].forEach.call(stars.children,x=>x.classList.remove("hot")); };
  wrap.appendChild(stars);
  if(mine) wrap.appendChild(el("span","rate-mine",mine+"/5"));
  if(!STORE_OK) wrap.appendChild(el("span","rate-note","nicht verfügbar"));
  return wrap;
}
async function submitRating(key,val){
  if(!STORE_OK||!USER) return;
  try{ STATE=await STORE.save(key,val); notice(""); rerenderAll(); }
  catch(e){ notice(/403/.test(e.message)
    ? "Keine Schreibrechte auf dieser Seite (403) — Bewerten erfordert Bearbeitungsrecht für die Confluence-Seite."
    : "Speichern fehlgeschlagen: "+e.message, "warn"); }
}

function fmtAvg(x){ return x.toFixed(1).replace(".",","); }
function starAvg(avg){
  const pct=Math.max(0,Math.min(100,avg/5*100)); const w=el("span","staravg");
  w.innerHTML='<span class="sa-base">★★★★★</span><span class="sa-fill" style="width:'+pct+'%">★★★★★</span>';
  return w;
}

function renderLeaderboard(){
  const host=$("#leaderboard"); if(!host) return;
  const counts={}; let total=0;
  Object.values(STATE.ratings||{}).forEach(by=>Object.keys(by).forEach(u=>{ counts[u]=(counts[u]||0)+1; total++; }));
  const rows=Object.entries(counts).map(([u,n])=>({u,n,name:(STATE.names&&STATE.names[u])||u}))
    .sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  host.innerHTML="";
  const head=el("div","sec-head");
  head.innerHTML='<span class="sec-title">Mitmach-Wertung</span><span class="sec-sub">'
    +total+" "+(total===1?"Bewertung":"Bewertungen")+" insgesamt"
    +(rows.length?" · "+rows.length+" "+(rows.length===1?"Teilnehmer":"Teilnehmende"):"")+"</span>";
  host.appendChild(head);
  if(!rows.length){ host.appendChild(el("div","lb-empty",
    "Noch keine Bewertung abgegeben — sei der/die Erste und vergib unten Sterne!")); return; }
  const list=el("div","lb-list");
  rows.slice(0,10).forEach((r,i)=>{
    const me=USER&&r.u===USER.name;
    const chip=el("div","lb-chip"+(me?" me":"")+(i<3?" top":""));
    chip.appendChild(el("span","lb-rank",String(i+1)));
    chip.appendChild(el("span","lb-name",r.name+(me?" (du)":"")));
    chip.appendChild(el("span","lb-n",String(r.n)));
    list.appendChild(chip);
  });
  host.appendChild(list);
  if(rows.length>10) host.appendChild(el("div","lb-more","und "+(rows.length-10)+" weitere"));
  const mine=USER?(counts[USER.name]||0):0;
  host.appendChild(el("div","lb-nudge", mine
    ? "Du hast "+mine+" "+(mine===1?"Output":"Outputs")+" bewertet — danke! Jede weitere Stimme hilft."
    : "Vergib unten Sterne für die Outputs — deine Stimme zählt!"));
}

function renderSummary(){
  const host=$("#summary"); if(!host) return;
  if(!IS_ADMIN){ host.style.display="none"; return; }
  host.style.display="";
  const agg={};
  Object.entries(STATE.ratings||{}).forEach(([key,by])=>{
    const slug=key.split("::")[1]; if(!slug) return;
    Object.values(by).forEach(v=>{ (agg[slug]=agg[slug]||{sum:0,n:0}).sum+=v; agg[slug].n++; });
  });
  host.innerHTML="";
  const totalVotes=Object.values(agg).reduce((s,a)=>s+a.n,0);
  const head=el("div","sec-head");
  head.innerHTML='<span class="sec-title">Bewertungen der Nutzer · Zusammenfassung</span>'
    +'<span class="sec-sub">nur für '+ADMIN_GROUP+" · "+totalVotes+" "+(totalVotes===1?"Stimme":"Stimmen")+"</span>";
  host.appendChild(head);
  const tbl=el("div","rsum-list");
  DATA.models.forEach(m=>{
    const a=agg[m.slug]; const avg=a&&a.n?a.sum/a.n:0;
    const row=el("div","rsum-row");
    const nm=el("div","rsum-name"); nm.innerHTML=m.name+(m.statusQuo?' <span class="sqmini">Status quo</span>':'');
    row.appendChild(nm);
    const right=el("div","rsum-val");
    if(a&&a.n){ right.appendChild(starAvg(avg));
      right.appendChild(el("span","rsum-num",fmtAvg(avg)));
      right.appendChild(el("span","rsum-cnt","("+a.n+")")); }
    else right.appendChild(el("span","rsum-none","noch keine Stimmen"));
    row.appendChild(right); tbl.appendChild(row);
  });
  host.appendChild(tbl);
}

function rerenderAll(){ sync(); renderLeaderboard(); renderSummary(); }

async function initRatings(){
  const ctx=ctxPath(), pid=pageId();
  if(window.AJS && pid){
    STORE=confluenceStore(ctx,pid);
    try{ const got=await STORE.get(); STATE=got.value; STORE_OK=true; }
    catch(e){ STORE_OK=false; notice("Bewertungen konnten nicht geladen werden ("+e.message+").","warn"); }
    USER=await loadUser(ctx);
    if(!USER){ STORE_OK=false; notice("Nicht angemeldet — Bewertungen sichtbar, aber keine Abgabe möglich.","info"); }
    else { try{ IS_ADMIN=await isInAdminGroup(ctx,USER.name); }catch(e){} }
  } else {
    USER={name:"vorschau",display:"Vorschau-Nutzer"}; STORE=memoryStore(); STORE_OK=true; IS_ADMIN=true;
    notice("Vorschaumodus: kein Confluence-Kontext erkannt — Bewertungen werden nicht gespeichert; die Admin-Zusammenfassung ist hier nur zur Ansicht eingeblendet.","info");
  }
  rerenderAll();
}

sync();
initRatings();
})();
</script>
