[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests

markers =
    real_embeddings: Test benutzt das echte retrieve_style_examples (Default-Stub aus tests/integration/conftest.py greift nicht; Test muss SQLite-kompatibel sein oder pgvector-Query selbst mocken)
    needs_ollama: Test braucht erreichbares Ollama - sollte in tests/eval/ liegen, nicht in tests/unit oder tests/integration

# Coverage nur wenn pytest-cov installiert ist:
#   pip install pytest-cov
#   pytest --cov=app --cov-report=term-missing --cov-report=html:tests/coverage_html --cov-fail-under=70
